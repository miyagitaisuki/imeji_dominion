        .btn-3d:active:not(:disabled) {
            transform: translateY(3px);

        .btn-green {

            color: #AFB5C0;

            background-color: #1CB0F6;

            color: #FFFFFF;
        }
        .btn-blue:hover:not(:disabled) {

        }

            background-color: #A855F7;
            border-bottom: 4px solid #7E22CE;
            color: #FFFFFF;
        }
        .btn-purple:hover:not(:disabled) {
            background-color: #B666FF;
        }

            background-color: #F59E0B;
            border-bottom: 4px solid #D97706;
            color: #FFFFFF;
        }
        .btn-amber:hover:not(:disabled) {
            background-color: #FBBF24;
        }

            border: 2px solid #E2E8F0;

        }

            background-color: #E0F2FE;
            border-color: #38BDF8;
            border-bottom-color: #0284C7;
            color: #0369A1;
        }

        .btn-option-correct {
            background-color: #D7FFB8 !important;
            border-color: #58CC02 !important;
            border-bottom-color: #46A302 !important;
            color: #2B6600 !important;
        }
        .btn-option-wrong {
            background-color: #FFDFE0 !important;
            border-color: #FF4B4B !important;
            border-bottom-color: #EA2B2B !important;
            color: #A30000 !important;
        }

        @keyframes pulse-gold {
            0%, 100% { background-color: #F59E0B; }
            50% { background-color: #FBBF24; }
        }
        .progress-near-finish {
            animation: pulse-gold 1.5s infinite ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .anim-pop { animation: pop 0.25s ease-in-out; }
        .anim-shake { animation: shake 0.35s ease-in-out; }

        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;

                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Engine Code
        const KEY_HIGH = LESSON_CONFIG.storagePrefix + '_highscore';
        const KEY_MISTAKES = LESSON_CONFIG.storagePrefix + '_mistakes';
        const _memStore = {};
        function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in _memStore) ? _memStore[k] : null; } }
        function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { _memStore[k] = v; } }

        function furi(s) {
            return String(s == null ? '' : s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        (function normalizeData() {
            GAME1_DATA.forEach(q => {
                q.kanji = furi(q.kanji || q.answer);
                q.distractorsKanji = q.distractors.map((d, i) => furi((q.distractorsKanji || [])[i] || d));
            });
            GAME2_DATA.forEach(q => {
                q.sentence = furi(q.sentence);
                q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
            });
            GAME3_DATA.forEach(q => q.blocks.forEach(b => { b.kanji = furi(b.kanji || b.text); }));
            GAME4_DATA.forEach(q => {
                q.question = furi(q.question);
                q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
            });
        })();

        function prepareQuestion(q) {
            if (q.context) {
                q.shuffledOptions = null;
            } else if (q.sentence || q.question) {
                if (!q._baseOptions) { q._baseOptions = q.options; q._baseCorrect = q.correctIndex; }
                const correct = q._baseOptions[q._baseCorrect];
                q.options = shuffleArray(q._baseOptions);
                q.correctIndex = q.options.indexOf(correct);
            }
            return q;
        }

        function validateData() {
            const warn = (m) => console.warn('[DATA]', m);
            const ids = new Set();
            [...GAME1_DATA, ...GAME2_DATA, ...GAME3_DATA, ...GAME4_DATA].forEach(q => {
                if (!q.id) warn('Thiếu id');
                else if (ids.has(q.id)) warn('Trùng id: ' + q.id);
                ids.add(q.id);
                if (!['easy', 'medium', 'hard'].includes(q.level)) warn('level sai: ' + q.id);
                const e = q.explanation || {};
                if (!e.correct || !e.pitfalls || !e.tip) warn('Thiếu explanation.correct/pitfalls/tip: ' + q.id);
            });
            GAME1_DATA.forEach(q => { if (!q.distractors || q.distractors.length !== 3) warn('Game1 cần đúng 3 distractors: ' + q.id); });
            GAME2_DATA.forEach(q => {
                if (!/＿/.test(q.sentence)) warn('Game2 thiếu chỗ trống ＿: ' + q.id);
                if (!q.options[q.correctIndex]) warn('Game2 correctIndex sai: ' + q.id);
            });
            GAME3_DATA.forEach(q => {
                const texts = q.blocks.map(b => b.text);
                q.acceptableOrders.forEach(o => o.forEach(t => { if (!texts.includes(t)) warn('Game3 acceptableOrders có khối không tồn tại "' + t + '": ' + q.id); }));
            });
            GAME4_DATA.forEach(q => { if (!q.options[q.correctIndex]) warn('Game4 correctIndex sai: ' + q.id); });
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        function startWeakPointsPractice() {
            try {
                const mistakes = JSON.parse(safeGet(KEY_MISTAKES) || '{}');
                const wrongKeys = Object.keys(mistakes);

                if (wrongKeys.length === 0) {
                    showToast("Bạn chưa có từ hay sai nào! Hãy làm bài luyện tập nhé.");
                    return;
                }

                const allQuestions = [...GAME1_DATA, ...GAME2_DATA, ...GAME3_DATA, ...GAME4_DATA];
                const matchedQuestions = allQuestions.filter(q => wrongKeys.includes(q.id || q.answer || q.sentence));

                if (matchedQuestions.length === 0) {
                    showToast("Chưa có đủ dữ liệu từ hay sai.");
                    return;
                }

                startCustomSession(matchedQuestions);
            } catch (e) {
                showToast("Chưa thể tải danh sách câu sai.");
            }
        }

        function startCustomSession(customList) {

            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            gameState.questions = shuffleArray(customList).slice(0, gameState.questionCount).map(prepareQuestion);

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            updateHeaderStats();
            renderQuestion();
        }

        function startGame(gameId) {
            playSound('click');
            gameState.currentGame = gameId;
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            let rawData = [];
            if (gameId === 1) rawData = GAME1_DATA;
            else if (gameId === 2) rawData = GAME2_DATA;
            else if (gameId === 3) rawData = GAME3_DATA;
            else if (gameId === 4) rawData = GAME4_DATA;

            let filtered = rawData;
            if (gameState.difficultyFilter !== 'all') {
                filtered = rawData.filter(q => q.level === gameState.difficultyFilter);
                if (filtered.length === 0) filtered = rawData;
            }

            const shuffled = shuffleArray(filtered);
            gameState.questions = shuffled.slice(0, Math.min(gameState.questionCount, shuffled.length)).map(prepareQuestion);

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            updateHeaderStats();
            renderQuestion();
        }

        function updateHeaderStats() {

            const progressText = document.getElementById('progress-text');

            progressInner.style.width = `${progress}%`;

            if (progress >= 80) {
                progressInner.className = "h-full rounded-full transition-all duration-300 progress-near-finish";
                progressText.innerHTML = `Câu ${currentNum} / ${totalNum} <span class="text-amber-500 font-black animate-pulse">🔥 Sắp hoàn thành!</span>`;
            } else {
                progressInner.className = "bg-[#58CC02] h-full rounded-full transition-all duration-300";
                progressText.innerText = `Câu ${currentNum} / ${totalNum}`;
            }

            document.getElementById('stat-streak').innerText = gameState.streak;
            document.getElementById('stat-hearts').innerText = gameState.hearts;
            document.getElementById('stat-score').innerText = gameState.score;

            const container = document.getElementById('game-container');

            const levelBadge = document.getElementById('level-badge');
            const levelText = (q.level || "easy").toUpperCase();
            levelBadge.innerText = levelText;
            levelBadge.className = q.level === 'hard' ? "bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md text-xs uppercase font-black" :
                                   q.level === 'medium' ? "bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md text-xs uppercase font-black" :
                                   "bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md text-xs uppercase font-black";

            if (q.context) renderGame1(q, container);
            else if (q.sentence) renderGame2(q, container);
            else if (q.acceptableOrders) {
                gameState.dragPoolBlocks = shuffleArray(q.blocks);
                gameState.dragSelectedBlocks = [];
                renderGame3(q, container);
            }
            else if (q.question) renderGame4(q, container);
        }

        function renderGame1(q, container) {
            if (!q.shuffledOptions || q.shuffledOptions.length === 0) {
                const options = [
                    { kana: q.answer, kanji: q.kanji, isCorrect: true },
                    ...q.distractors.map((d, idx) => ({ kana: d, kanji: q.distractorsKanji[idx], isCorrect: false }))
                ];
                q.shuffledOptions = shuffleArray(options);
            }

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Chọn đáp án đúng</h2>
                    
                    <div class="bg-emerald-50 border-2 border-emerald-200 p-5 md:p-6 rounded-2xl mb-5 w-full text-center shadow-inner">
                        <p class="text-lg md:text-2xl font-extrabold text-emerald-950">"${q.context}"</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full">
                        ${q.shuffledOptions.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectGame1Option(${idx})" class="btn-3d btn-gray p-4 md:p-5 rounded-2xl flex flex-col items-center justify-center text-center border-2 min-h-[90px]">
                                <div class="jp-text-lg">${opt.kanji}</div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectGame1Option(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;
            const q = gameState.questions[gameState.currentIndex];
            
            q.shuffledOptions.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });

            setCheckButtonState(true);
            speakJapanese(q.shuffledOptions[idx].kana);
        }

        function renderGame2(q, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-3 uppercase tracking-wider">Điền từ vào chỗ trống</h2>

                    <div class="bg-slate-50 border-2 border-slate-200 p-5 md:p-6 rounded-2xl mb-5 w-full text-center shadow-sm">
                        <div id="sentence-display" class="jp-text-xl text-slate-800 leading-relaxed mb-3">
                            ${q.sentence.replace(/＿+/, '<span id="blank-slot" class="inline-block border-b-4 border-emerald-500 min-w-[90px] px-2 text-emerald-600 font-extrabold">＿＿＿</span>')}
                        </div>

                        <div>
                            <button onclick="toggleTranslation()" class="text-xs md:text-sm text-slate-500 underline font-bold hover:text-slate-700 select-none">
                                👁️ <span id="trans-toggle-label">Hiện bản dịch</span>
                            </button>
                            <p id="translation-text" class="hidden text-sm md:text-base text-slate-600 font-bold mt-2 bg-white/70 p-2 rounded-xl border border-slate-200">
                                "${q.translation}"
                            </p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectGame2Option(${idx})" class="btn-3d btn-gray p-4 rounded-2xl text-center border-2 min-h-[64px] flex items-center justify-center">
                                <span class="jp-text-lg">${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleTranslation() {
            playSound('click');
            const trans = document.getElementById('translation-text');
            const label = document.getElementById('trans-toggle-label');
            if (trans.classList.contains('hidden')) {
                trans.classList.remove('hidden');
                label.innerText = 'Ẩn bản dịch';
            } else {
                trans.classList.add('hidden');
                label.innerText = 'Hiện bản dịch';
            }
        }

        function selectGame2Option(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;
            const q = gameState.questions[gameState.currentIndex];

            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });

            const blank = document.getElementById('blank-slot');
            if (blank) {
                blank.innerHTML = q.options[idx].kanji;
            }

            setCheckButtonState(true);
            speakJapanese(q.options[idx].text);
        }

        function renderGame3(q, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Sắp xếp các khối từ</h2>

                    <div class="bg-purple-50 border-2 border-purple-200 p-4 md:p-5 rounded-2xl mb-4 w-full text-center">
                        <p class="text-base md:text-xl font-black text-purple-950">"${q.vietnamese}"</p>
                    </div>

                    <div id="drop-area" class="w-full min-h-[90px] p-3 border-2 border-dashed border-slate-300 rounded-2xl bg-slate-50 flex flex-wrap items-center justify-center gap-2 mb-4">
                        ${gameState.dragSelectedBlocks.length === 0 ? `
                            <span class="text-xs md:text-sm text-slate-400 font-bold select-none">Chạm vào các từ bên dưới để ghép câu</span>
                        ` : gameState.dragSelectedBlocks.map((b, i) => `
                            <button onclick="deselectBlock(${i})" class="btn-3d btn-blue px-3.5 py-2 rounded-xl text-base md:text-lg font-bold">
                                ${b.kanji}
                            </button>
                        `).join('')}
                    </div>

                    <div id="pool-area" class="w-full flex flex-wrap items-center justify-center gap-2">
                        ${gameState.dragPoolBlocks.map((b, i) => `
                            <button onclick="selectPoolBlock(${i})" class="btn-3d btn-gray px-3.5 py-2 rounded-xl text-base md:text-lg font-bold">
                                ${b.kanji}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectPoolBlock(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            const block = gameState.dragPoolBlocks.splice(idx, 1)[0];
            gameState.dragSelectedBlocks.push(block);
            
            const q = gameState.questions[gameState.currentIndex];
            renderGame3(q, document.getElementById('game-container'));
            
            setCheckButtonState(gameState.dragSelectedBlocks.length > 0);
            speakJapanese(block.text);
        }

        function deselectBlock(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            const block = gameState.dragSelectedBlocks.splice(idx, 1)[0];
            gameState.dragPoolBlocks.push(block);
            
            const q = gameState.questions[gameState.currentIndex];
            renderGame3(q, document.getElementById('game-container'));
            
            setCheckButtonState(gameState.dragSelectedBlocks.length > 0);
        }

        function renderGame4(q, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Chọn câu phản hồi đúng</h2>

                    <div class="bg-amber-50 border-2 border-amber-200 p-5 rounded-2xl mb-5 w-full flex flex-col items-start gap-2">
                        <div class="text-xs font-black text-amber-800 bg-amber-200 px-2.5 py-1 rounded-lg">${q.speaker}</div>
                        <div class="flex items-center justify-between w-full gap-2">
                            <p class="jp-text-lg text-amber-950 font-bold">${q.question}</p>
                            <button onclick="speakJapanese('${q.questionAudioText || q.question}')" class="p-2 bg-amber-200 text-amber-900 rounded-xl hover:bg-amber-300 text-lg shrink-0">
                                🔊
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectGame4Option(${idx})" class="btn-3d btn-gray p-4 rounded-2xl text-left border-2 min-h-[64px] flex items-center">
                                <span class="jp-text-lg text-slate-800">${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            setTimeout(() => {
                speakJapanese(q.questionAudioText || q.question);
            }, 300);
        }

        function selectGame4Option(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;
            const q = gameState.questions[gameState.currentIndex];

            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });

            setCheckButtonState(true);
            speakJapanese(q.options[idx].text);
        }

        function handleActionButton() {
            if (!gameState.isAnswerChecked) {
                checkAnswer();
            } else {
                gameState.currentIndex++;
                if (gameState.currentIndex < gameState.questions.length) {
                    updateHeaderStats();
                    renderQuestion();
                } else {
                    showEndScreen();
                }
            }
        }

        function checkAnswer() {
            const q = gameState.questions[gameState.currentIndex];
            let isCorrect = false;

            if (q.context) {
                const chosen = q.shuffledOptions[gameState.selectedOptionIndex];
                isCorrect = chosen.isCorrect;
            } else if (q.sentence || q.question) {
                isCorrect = gameState.selectedOptionIndex === q.correctIndex;
            } else if (q.acceptableOrders) {
                const userOrder = gameState.dragSelectedBlocks.map(b => b.text);
                isCorrect = q.acceptableOrders.some(order => 
                    order.length === userOrder.length && order.every((val, i) => val === userOrder[i])
                );
            }

            gameState.isAnswerChecked = true;

            const bottomBar = document.getElementById('bottom-bar');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDiff = document.getElementById('feedback-diff');
            const explanationWrapper = document.getElementById('explanation-wrapper');
            const feedbackExplanation = document.getElementById('feedback-explanation');
            const btnAction = document.getElementById('btn-action');

            feedbackIcon.classList.remove('hidden');
            explanationWrapper.classList.remove('hidden');

            const exp = q.explanation || {};
            feedbackExplanation.innerHTML = `
                <p class="text-emerald-700 font-extrabold mb-1">✅ ${exp.correct || ''}</p>
                <p class="text-rose-600 font-bold mb-1">⚠️ ${exp.pitfalls || ''}</p>
                <p class="text-blue-600 font-bold">💡 ${exp.tip || ''}</p>
            `;

            if (isCorrect) {
                playSound('correct');
                gameState.score += 10 + (gameState.streak * 2);
                gameState.correctCount++;
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;

                bottomBar.className = "border-t-2 border-emerald-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 bg-emerald-100 shrink-0";
                feedbackIcon.innerText = "🎉";
                feedbackTitle.innerText = "Chính xác! Tuyệt vời!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-emerald-800";
                feedbackDiff.innerText = `+${10 + ((gameState.streak - 1) * 2)} điểm! (Chuỗi ${gameState.streak} 🔥)`;
                feedbackDiff.className = "text-sm font-bold text-emerald-700";

                highlightOptions(q, true);
            } else {
                playSound('wrong');
                gameState.streak = 0;
                gameState.hearts--;
                gameState.wrongAnswers.push(q);
                recordMistake(q);

                bottomBar.className = "border-t-2 border-rose-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 bg-rose-100 shrink-0";
                feedbackIcon.innerText = "😅";
                feedbackTitle.innerText = "Chưa chính xác rồi!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-rose-800";
                feedbackDiff.innerText = "Đừng nản lòng, hãy xem giải thích nhé!";
                feedbackDiff.className = "text-sm font-bold text-rose-700";

                highlightOptions(q, false);

                if (gameState.hearts <= 0) {
                    setTimeout(() => {
                        showModalHearts();
                    }, 800);
                }
            }

            updateHeaderStats();

            btnAction.innerText = "CÂU TIẾP TỤC ➔";
            btnAction.className = "btn-3d btn-blue text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";
            setCheckButtonState(true);
        }

        function highlightOptions(q, isCorrect) {
            if (q.context) {
                q.shuffledOptions.forEach((opt, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (!btn) return;
                    if (opt.isCorrect) btn.className = "btn-3d p-4 md:p-5 rounded-2xl flex flex-col items-center justify-center text-center border-2 min-h-[90px] btn-option-correct";
                    else if (idx === gameState.selectedOptionIndex && !isCorrect) btn.className = "btn-3d p-4 md:p-5 rounded-2xl flex flex-col items-center justify-center text-center border-2 min-h-[90px] btn-option-wrong";
                });
            } else if (q.sentence || q.question) {
                q.options.forEach((_, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (!btn) return;
                    if (idx === q.correctIndex) btn.className = "btn-3d p-4 rounded-2xl text-center border-2 min-h-[64px] flex items-center justify-center btn-option-correct";
                    else if (idx === gameState.selectedOptionIndex && !isCorrect) btn.className = "btn-3d p-4 rounded-2xl text-center border-2 min-h-[64px] flex items-center justify-center btn-option-wrong";
                });
            }
        }

        function showModalHearts() {
            const modal = document.getElementById('hearts-modal');
            const btnReview = document.getElementById('btn-modal-review');
            if (gameState.wrongAnswers.length > 0) btnReview.classList.remove('hidden');
            else btnReview.classList.add('hidden');
            modal.classList.remove('hidden');
        }

        function showEndScreen() {
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('bottom-bar').classList.add('hidden');

            const container = document.getElementById('game-container');
            const total = gameState.questions.length;
            const percent = Math.round((gameState.correctCount / total) * 100);

            const oldHigh = parseInt(safeGet(KEY_HIGH) || '0', 10);
            if (gameState.score > oldHigh) {
                safeSet(KEY_HIGH, gameState.score.toString());
            }

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-md py-6 text-center anim-pop">
                    <div class="text-6xl mb-3">🏆</div>
                    <h2 class="text-3xl font-black text-slate-800 mb-1">Hoàn thành Luyện tập!</h2>
                    <p class="text-base text-slate-500 font-bold mb-6">${LESSON_CONFIG.title}</p>

                    <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-5 w-full mb-6 grid grid-cols-2 gap-4">
                        <div class="bg-white p-3 rounded-xl border border-slate-200">
                            <div class="text-xs text-slate-400 font-extrabold uppercase">Điểm số</div>
                            <div class="text-2xl font-black text-amber-500">${gameState.score} ⭐</div>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-slate-200">
                            <div class="text-xs text-slate-400 font-extrabold uppercase">Tỷ lệ đúng</div>
                            <div class="text-2xl font-black text-emerald-500">${percent}%</div>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-slate-200">
                            <div class="text-xs text-slate-400 font-extrabold uppercase">Chuỗi dài nhất</div>
                            <div class="text-2xl font-black text-orange-500">${gameState.maxStreak} 🔥</div>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-slate-200">
                            <div class="text-xs text-slate-400 font-extrabold uppercase">Số câu đúng</div>
                            <div class="text-2xl font-black text-blue-500">${gameState.correctCount}/${total}</div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${gameState.wrongAnswers.length > 0 ? `
                            <button onclick="practiceCurrentWrongList()" class="btn-3d btn-blue py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                                🎯 Ôn lại ${gameState.wrongAnswers.length} câu làm sai
                            </button>
                        ` : ''}
                        <button onclick="startGame(gameState.currentGame)" class="btn-3d btn-green py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                            🔄 Luyện lại bài này
                        </button>
                        <button onclick="showMainMenu()" class="btn-3d btn-gray py-3.5 rounded-2xl font-black text-lg text-slate-700">
                            🏠 Về Menu chính
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
