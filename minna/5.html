    <style>
        *, *::before, *::after {

        .select-none {

        }

        }
        rt {

            line-height: 1.4;
        }
        .jp-text-xl {
            font-size: clamp(1.5rem, 3.5vw, 2.75rem);
            font-weight: 700;
            line-height: 1.4;
        }

        /* 3D Button Effects */
        .btn-3d {
            transition: all 0.1s ease;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }
        
        .btn-green {
            background-color: #58CC02;
            border-bottom: 4px solid #46A302;
            color: #FFFFFF;
        }
        .btn-green:hover:not(:disabled) {
            background-color: #61E002;
        }
        .btn-green:disabled {
            background-color: #E5E5E5;
            border-bottom-color: #CECECE;
            color: #AFB5C0;
            cursor: not-allowed;
        }

        .btn-blue {
            background-color: #1CB0F6;
            border-bottom: 4px solid #1899D6;
            color: #FFFFFF;
        }
        .btn-blue:hover:not(:disabled) {
            background-color: #24BDFF;
        }

        .btn-purple {
            background-color: #A855F7;
            border-bottom: 4px solid #7E22CE;
            color: #FFFFFF;
        }
        .btn-purple:hover:not(:disabled) {
            background-color: #B666FF;
        }

        .btn-amber {
            background-color: #F59E0B;
            border-bottom: 4px solid #D97706;
            color: #FFFFFF;
        }
        .btn-amber:hover:not(:disabled) {
            background-color: #FBBF24;
        }

        .btn-gray {
            background-color: #FFFFFF;
            border: 2px solid #E2E8F0;
            border-bottom: 4px solid #CBD5E1;
            color: #334155;
        }
        .btn-gray:hover:not(:disabled) {
            background-color: #F8FAFC;
        }
        .btn-gray.selected {
            background-color: #E0F2FE;
            border-color: #38BDF8;
            border-bottom-color: #0284C7;
            color: #0369A1;
        }

        /* Feedback states for options */
        .btn-option-correct {
            background-color: #D7FFB8 !important;
            border-color: #58CC02 !important;
            border-bottom-color: #46A302 !important;
            color: #2B6600 !important;
        }
        .btn-option-wrong {
            background-color: #FFDFE0 !important;
            border-color: #FF4B4B !important;
            border-bottom-color: #EA2B2B !important;
            color: #A30000 !important;
        }

        @keyframes pulse-gold {
            0%, 100% { background-color: #F59E0B; }
            50% { background-color: #FBBF24; }
        }
        .progress-near-finish {
            animation: pulse-gold 1.5s infinite ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .anim-pop { animation: pop 0.25s ease-in-out; }
        .anim-shake { animation: shake 0.35s ease-in-out; }

        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

    <script>
        const LESSON_CONFIG = {

            title: "Minna no Nihongo – Bài 5",

        // GAME 1 DATA: Từ Vựng (25 câu)
        const GAME1_DATA = [
            {
                id: "l05_v001", level: "easy",
                context: "Di chuyển từ nơi hiện tại đến một địa điểm khác xa hơn.",
                answer: "いきます", kanji: "{行|い}きます",
                distractors: ["きます", "かえります", "やすみます"],
                distractorsKanji: ["{来|き}ます", "{帰|かえ}ります", "{休|やす}みます"],

                    correct: "行きます (いきます) có nghĩa là đi đến nơi khác.",

            {

                answer: "きます", kanji: "{来|き}ます",

                distractorsKanji: ["{行|い}きます", "{帰|かえ}ります", "{起|お}きます"],
                explanation: {

            {

                distractorsKanji: ["{行|い}きます", "{来|き}ます", "{働|はたら}きます"],

            {

            },
            {
                id: "l05_v005", level: "easy",

                    tip: "Viết bằng Katakana từ chữ Supermarket."

            },
            {
                id: "l05_v006", level: "easy",
                context: "Nơi tàu điện dừng lại để hành khách lên xuống xe.",
                answer: "えき", kanji: "{駅|えき}",
                distractors: ["がっこう", "びょういん", "ぎんこう"],

        // Utility Functions
        function furi(str) {
            if (!str) return '';
            return str.replace(/\{([^|]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        (function normalizeData() {
            GAME1_DATA.forEach(q => {
                q.kanji = furi(q.kanji || q.answer);
                q.distractorsKanji = q.distractors.map((d, i) => furi((q.distractorsKanji || [])[i] || d));
            });
            GAME2_DATA.forEach(q => {
                q.sentence = furi(q.sentence);
                q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
            });
            GAME3_DATA.forEach(q => q.blocks.forEach(b => { b.kanji = furi(b.kanji || b.text); }));
            GAME4_DATA.forEach(q => {
                q.question = furi(q.question);
                q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
            });
        })();

        const KEY_MISTAKES = `${LESSON_CONFIG.storagePrefix}_mistakes`;

        // Audio Effects (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.12);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.warn("Audio Context play error:", e);
            }
        }

        function speakJapanese(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\{([^|]+)\|[^}]+\}/g, '$1').replace(/<[^>]*>/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function safeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (e) {}
        }

        function recordMistake(q) {
            try {
                const mistakes = JSON.parse(safeGet(KEY_MISTAKES) || '{}');
                const key = q.id || q.answer || q.sentence;
                mistakes[key] = (mistakes[key] || 0) + 1;
                safeSet(KEY_MISTAKES, JSON.stringify(mistakes));
            } catch (e) {}
        }

            const toast = document.getElementById('toast');

            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {

                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 2000);
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startGame(gameType) {
            gameState.currentGame = gameType;
            let pool = [];
            if (gameType === 1) pool = GAME1_DATA;
            else if (gameType === 2) pool = GAME2_DATA;
            else if (gameType === 3) pool = GAME3_DATA;
            else if (gameType === 4) pool = GAME4_DATA;

            if (gameState.difficultyFilter !== 'all') {
                const filtered = pool.filter(q => q.level === gameState.difficultyFilter);
                if (filtered.length > 0) pool = filtered;
            }

            let selected = shuffleArray(pool);
            if (selected.length > gameState.questionCount) {
                selected = selected.slice(0, gameState.questionCount);
            }

            gameState.questions = selected.map(q => JSON.parse(JSON.stringify(q)));
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');
            updateHeaderStats();
            renderQuestion();
        }

        function startCustomSession(questions) {
            gameState.currentGame = 0;
            gameState.questions = shuffleArray(questions).map(q => JSON.parse(JSON.stringify(q)));
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');
            updateHeaderStats();
            renderQuestion();
        }

        function practiceCurrentWrongList() {
            if (gameState.wrongAnswers.length === 0) return;
            document.getElementById('hearts-modal').classList.add('hidden');
            startCustomSession([...gameState.wrongAnswers]);
        }

        function retryCurrentGame() {
            document.getElementById('hearts-modal').classList.add('hidden');
            if (gameState.currentGame) {
                startGame(gameState.currentGame);
            } else {
                showMainMenu();
            }
        }

        function startWeakPointsPractice() {
            try {
                const mistakes = JSON.parse(safeGet(KEY_MISTAKES) || '{}');
                const mistakeKeys = Object.keys(mistakes);
                if (mistakeKeys.length === 0) {
                    showToast("Bạn chưa có từ/câu nào bị sai!");
                    return;
                }
                const allQuestions = [...GAME1_DATA, ...GAME2_DATA, ...GAME3_DATA, ...GAME4_DATA];
                const weakQuestions = allQuestions.filter(q => mistakeKeys.includes(q.id || q.answer || q.sentence));
                if (weakQuestions.length === 0) {
                    showToast("Không tìm thấy câu hỏi sai phù hợp!");
                    return;
                }
                startCustomSession(weakQuestions);
            } catch (e) {
                showToast("Có lỗi xảy ra khi tải danh sách ôn tập!");
            }
        }

            document.getElementById('stat-streak').innerText = gameState.streak;
            document.getElementById('stat-hearts').innerText = gameState.hearts;
            document.getElementById('stat-score').innerText = gameState.score;
        }

        function renderQuestion() {
            gameState.selectedOptionIndex = null;
            gameState.dragSelectedBlocks = [];
            gameState.isAnswerChecked = false;
            resetBottomBar();

            const q = gameState.questions[gameState.currentIndex];
            const pct = (gameState.currentIndex / gameState.questions.length) * 100;
            const innerProgress = document.getElementById('progress-inner');
            innerProgress.style.width = pct + '%';
            if (pct >= 80) {
                innerProgress.classList.add('progress-near-finish');
            } else {
                innerProgress.classList.remove('progress-near-finish');
            }

            document.getElementById('progress-text').innerText = `Câu ${gameState.currentIndex + 1} / ${gameState.questions.length}`;

            // Check what game type rendering is needed
            if (q.context) {
                renderGame1(q);
            } else if (q.sentence) {
                renderGame2(q);
            } else if (q.acceptableOrders) {
                renderGame3(q);
            } else if (q.speaker || q.question) {
                renderGame4(q);
            }
        }

        function renderGame1(q) {
            if (!q.shuffledOptions) {
                const options = [
                    { text: q.answer, kanji: q.kanji, isCorrect: true },
                    ...q.distractors.map((d, i) => ({ text: d, kanji: q.distractorsKanji[i], isCorrect: false }))

                q.shuffledOptions = shuffleArray(options);

            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center anim-pop">
                    <div class="bg-emerald-50 border-2 border-emerald-200 rounded-3xl p-6 md:p-8 text-center w-full mb-6 shadow-sm">
                        <span class="text-xs font-black uppercase tracking-wider text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full">Từ Vựng</span>

                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full">

                            <button id="opt-${idx}" onclick="selectOption(${idx})" class="btn-3d btn-gray p-4 md:p-5 rounded-2xl text-left font-bold text-lg md:text-xl flex items-center justify-between transition-all">
                                <span class="jp-text-lg">${opt.kanji}</span>
                                <span class="text-xs bg-slate-100 text-slate-500 rounded-full w-7 h-7 flex items-center justify-center font-extrabold border border-slate-200">${idx + 1}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderGame2(q) {
            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center anim-pop">
                    <div class="bg-sky-50 border-2 border-sky-200 rounded-3xl p-6 md:p-8 text-center w-full mb-6 shadow-sm">
                        <span class="text-xs font-black uppercase tracking-wider text-sky-600 bg-sky-100 px-3 py-1 rounded-full">Ngữ Pháp</span>
                        <p class="text-sm font-bold text-slate-500 mt-2">${q.translation || ''}</p>
                        <div class="jp-text-xl font-bold text-slate-800 mt-4">${q.sentence.replace(/＿/g, '<span class="inline-block border-b-4 border-sky-500 px-3 text-sky-600 font-extrabold">？</span>')}</div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectOption(${idx})" class="btn-3d btn-gray p-4 md:p-5 rounded-2xl text-center font-bold text-lg md:text-xl transition-all">
                                <span class="jp-text-lg">${opt.kanji || opt.text}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderGame3(q) {
            if (!q._initialized) {
                q._initialized = true;
                gameState.dragPoolBlocks = shuffleArray(q.blocks.map((b, i) => ({ ...b, id: i })));
                gameState.dragSelectedBlocks = [];
            }
            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="w-full max-w-3xl flex flex-col items-center anim-pop">
                    <div class="bg-purple-50 border-2 border-purple-200 rounded-3xl p-5 md:p-6 text-center w-full mb-6 shadow-sm">
                        <span class="text-xs font-black uppercase tracking-wider text-purple-600 bg-purple-100 px-3 py-1 rounded-full">Xếp Câu</span>
                        <h2 class="text-lg md:text-xl font-bold text-slate-800 mt-2">${q.vietnamese}</h2>
                    </div>

                    <!-- Target Area -->
                    <div id="selected-area" class="w-full min-h-[72px] p-3 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl flex flex-wrap gap-2 items-center mb-6">
                        ${gameState.dragSelectedBlocks.length === 0 ? '<span class="text-slate-400 font-bold text-sm mx-auto">Nhấp chọn các khối bên dưới theo đúng thứ tự...</span>' : ''}
                        ${gameState.dragSelectedBlocks.map((b) => `
                            <button onclick="unselectBlock(${b.id})" class="btn-3d btn-purple px-4 py-2.5 rounded-xl font-bold text-base md:text-lg flex items-center gap-1 anim-pop">
                                <span>${b.kanji || b.text}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Source Area -->
                    <div id="pool-area" class="w-full flex flex-wrap gap-2.5 justify-center">
                        ${gameState.dragPoolBlocks.map((b) => {
                            const isSelected = gameState.dragSelectedBlocks.some(sb => sb.id === b.id);
                            return `
                                <button onclick="selectBlock(${b.id})" ${isSelected ? 'disabled' : ''} class="btn-3d ${isSelected ? 'btn-gray opacity-30 cursor-not-allowed' : 'btn-gray'} px-4 py-2.5 rounded-xl font-bold text-base md:text-lg">
                                    <span>${b.kanji || b.text}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            updateActionButtonState(gameState.dragSelectedBlocks.length > 0);
        }

        function renderGame4(q) {
            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="w-full max-w-2xl flex flex-col items-center anim-pop">
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-6 md:p-8 w-full mb-6 shadow-sm relative">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-black uppercase tracking-wider text-amber-700 bg-amber-100 px-3 py-1 rounded-full">${q.speaker || 'Hội thoại'}</span>
                            <button onclick="speakJapanese('${q.questionAudioText || q.question}')" class="btn-3d btn-amber p-2 rounded-xl text-lg flex items-center justify-center min-w-[40px] min-h-[40px]" title="Nghe phát âm">
                                🔊
                            </button>
                        </div>
                        <div class="jp-text-xl font-bold text-slate-800">${q.question}</div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectOption(${idx})" class="btn-3d btn-gray p-4 md:p-5 rounded-2xl text-left font-bold text-base md:text-lg flex items-center justify-between transition-all">
                                <span class="jp-text-lg">${opt.kanji || opt.text}</span>
                                <button onclick="event.stopPropagation(); speakJapanese('${opt.text}')" class="text-slate-400 hover:text-amber-500 p-1 text-lg" title="Nghe">🔊</button>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectOption(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;

            const q = gameState.questions[gameState.currentIndex];
            const optionCount = q.shuffledOptions ? q.shuffledOptions.length : q.options.length;
            for (let i = 0; i < optionCount; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) btn.classList.remove('selected');
            }
            const selectedBtn = document.getElementById(`opt-${idx}`);
            if (selectedBtn) selectedBtn.classList.add('selected');

            updateActionButtonState(true);
        }

        function selectBlock(id) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            const block = gameState.dragPoolBlocks.find(b => b.id === id);
            if (block && !gameState.dragSelectedBlocks.some(b => b.id === id)) {
                gameState.dragSelectedBlocks.push(block);
                const q = gameState.questions[gameState.currentIndex];
                renderGame3(q);
            }
        }

        function unselectBlock(id) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.dragSelectedBlocks = gameState.dragSelectedBlocks.filter(b => b.id !== id);
            const q = gameState.questions[gameState.currentIndex];
            renderGame3(q);
        }

        function updateActionButtonState(enabled) {
            const btn = document.getElementById('btn-action');
            btn.disabled = !enabled;
        }

        function handleActionButton() {
            if (!gameState.isAnswerChecked) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function checkAnswer() {
            const q = gameState.questions[gameState.currentIndex];
            let isCorrect = false;

            if (q.context) {
                // Game 1
                isCorrect = q.shuffledOptions[gameState.selectedOptionIndex].isCorrect;
            } else if (q.sentence) {
                // Game 2
                isCorrect = (gameState.selectedOptionIndex === q.correctIndex);
            } else if (q.acceptableOrders) {
                // Game 3
                const userSequence = gameState.dragSelectedBlocks.map(b => b.text).join(' ');
                isCorrect = q.acceptableOrders.some(orderArr => orderArr.join(' ') === userSequence);
            } else if (q.speaker || q.question) {
                // Game 4
                isCorrect = (gameState.selectedOptionIndex === q.correctIndex);
            }

            gameState.isAnswerChecked = true;

            // Option styling feedback
            if (q.shuffledOptions) {
                q.shuffledOptions.forEach((opt, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (!btn) return;
                    if (opt.isCorrect) btn.classList.add('btn-option-correct');
                    else if (idx === gameState.selectedOptionIndex) btn.classList.add('btn-option-wrong');
                });
            } else if (q.options) {
                q.options.forEach((opt, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (!btn) return;
                    if (idx === q.correctIndex) btn.classList.add('btn-option-correct');
                    else if (idx === gameState.selectedOptionIndex) btn.classList.add('btn-option-wrong');
                });
            }

            if (isCorrect) {
                playSound('correct');
                gameState.score += 10 + gameState.streak * 2;
                gameState.correctCount++;
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;
            } else {
                playSound('wrong');
                gameState.streak = 0;
                gameState.hearts--;
                gameState.wrongAnswers.push(q);
                recordMistake(q);

                const container = document.getElementById('game-container');
                container.classList.add('anim-shake');
                setTimeout(() => container.classList.remove('anim-shake'), 400);
            }

            updateHeaderStats();
            showFeedback(isCorrect, q.explanation, q.level);
        }

        function showFeedback(isCorrect, explanation, level) {
            const bottomBar = document.getElementById('bottom-bar');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const diff = document.getElementById('feedback-diff');
            const expWrapper = document.getElementById('explanation-wrapper');
            const expContent = document.getElementById('feedback-explanation');

            icon.classList.remove('hidden');
            if (isCorrect) {
                bottomBar.className = "border-t-4 border-emerald-500 bg-emerald-50 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 shrink-0";
                icon.innerText = "🎉";
                title.className = "text-lg md:text-xl font-black text-emerald-800";
                title.innerText = "Chính xác! Xuất sắc lắm!";
            } else {
                bottomBar.className = "border-t-4 border-rose-500 bg-rose-50 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 shrink-0";
                icon.innerText = "😅";
                title.className = "text-lg md:text-xl font-black text-rose-800";
                title.innerText = "Chưa chính xác rồi!";
            }

            const diffLabels = { easy: "🟢 Dễ", medium: "🟡 Vừa", hard: "🔴 Khó" };
            diff.className = "text-xs md:text-sm font-bold text-slate-500";
            diff.innerText = `Độ khó: ${diffLabels[level] || 'N5'}`;

            if (explanation) {
                expWrapper.classList.remove('hidden');
                expContent.innerHTML = `
                    <div class="mb-1 text-emerald-700 font-bold">✔️ ${furi(explanation.correct || '')}</div>
                    <div class="mb-1 text-rose-600 font-bold">⚠️ ${furi(explanation.pitfalls || '')}</div>
                    <div class="text-sky-700 font-bold">💡 Mẹo: ${furi(explanation.tip || '')}</div>
                `;
            } else {
                expWrapper.classList.add('hidden');
            }

            const btnAction = document.getElementById('btn-action');
            btnAction.disabled = false;
            btnAction.innerText = (gameState.currentIndex >= gameState.questions.length - 1) ? "XEM KẾT QUẢ" : "TIẾP THEO";
            btnAction.className = isCorrect ?
                "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto" :
                "btn-3d btn-amber text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";
        }

        function toggleExplanationDetails() {
            const expContent = document.getElementById('feedback-explanation');
            const arrow = document.getElementById('exp-arrow');
            if (expContent.classList.contains('hidden')) {
                expContent.classList.remove('hidden');
                arrow.innerText = '▲';
            } else {
                expContent.classList.add('hidden');
                arrow.innerText = '▼';
            }
        }

        function resetBottomBar() {
            const bottomBar = document.getElementById('bottom-bar');
            bottomBar.className = "border-t-2 border-slate-200 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 transition-colors duration-300 bg-white shrink-0";
            document.getElementById('feedback-icon').classList.add('hidden');
            document.getElementById('feedback-title').innerText = '';
            document.getElementById('feedback-diff').innerText = '';
            document.getElementById('explanation-wrapper').classList.add('hidden');
            document.getElementById('feedback-explanation').classList.add('hidden');
            document.getElementById('exp-arrow').innerText = '▼';

            const btnAction = document.getElementById('btn-action');
            btnAction.disabled = true;
            btnAction.innerText = "KIỂM TRA";
            btnAction.className = "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";
        }

        function nextQuestion() {
            if (gameState.hearts <= 0) {
                showGameOverModal();
                return;
            }

            gameState.currentIndex++;
            if (gameState.currentIndex >= gameState.questions.length) {
                showVictoryScreen();
            } else {
                renderQuestion();
            }
        }

        function showGameOverModal() {
            const modal = document.getElementById('hearts-modal');
            modal.classList.remove('hidden');
            const btnReview = document.getElementById('btn-modal-review');
            if (gameState.wrongAnswers.length > 0) {
                btnReview.classList.remove('hidden');
            } else {
                btnReview.classList.add('hidden');
            }
        }

        function showVictoryScreen() {
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('bottom-bar').classList.add('hidden');

            const highScore = parseInt(safeGet(KEY_HIGH) || 0, 10);
            if (gameState.score > highScore) {
                safeSet(KEY_HIGH, gameState.score);
            }

            const container = document.getElementById('game-container');
            const accuracy = Math.round((gameState.correctCount / gameState.questions.length) * 100);

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-lg text-center p-6 anim-pop">
                    <div class="text-7xl mb-4">🏆</div>
                    <h2 class="text-3xl md:text-4xl font-black text-slate-800 mb-2">Hoàn Thành Tuyệt Vời!</h2>
                    <p class="text-base font-bold text-slate-500 mb-6">Bạn đã hoàn thành các câu hỏi thuộc ${LESSON_CONFIG.title}!</p>

                    <div class="grid grid-cols-2 gap-4 w-full mb-6">
                        <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl">
                            <div class="text-xs font-black text-amber-700 uppercase">Tổng điểm</div>
                            <div class="text-2xl md:text-3xl font-black text-amber-600">${gameState.score}</div>
                        </div>
                        <div class="bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl">
                            <div class="text-xs font-black text-emerald-700 uppercase">Chính xác</div>
                            <div class="text-2xl md:text-3xl font-black text-emerald-600">${accuracy}%</div>
                        </div>
                        <div class="bg-orange-50 border-2 border-orange-200 p-4 rounded-2xl">
                            <div class="text-xs font-black text-orange-700 uppercase">Chuỗi cao nhất</div>
                            <div class="text-2xl md:text-3xl font-black text-orange-600">🔥 ${gameState.maxStreak}</div>
                        </div>
                        <div class="bg-sky-50 border-2 border-sky-200 p-4 rounded-2xl">
                            <div class="text-xs font-black text-sky-700 uppercase">Số câu đúng</div>
                            <div class="text-2xl md:text-3xl font-black text-sky-600">${gameState.correctCount} / ${gameState.questions.length}</div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${gameState.wrongAnswers.length > 0 ? `
                            <button onclick="practiceCurrentWrongList()" class="btn-3d btn-blue py-4 rounded-2xl font-black text-lg uppercase tracking-wider">
                                🎯 Ôn lại ${gameState.wrongAnswers.length} câu đã sai
                            </button>
                        ` : ''}
                        <button onclick="startGame(gameState.currentGame || 1)" class="btn-3d btn-green py-4 rounded-2xl font-black text-lg uppercase tracking-wider">
                            🔄 Chơi lại Lượt Mới
                        </button>
                        <button onclick="showMainMenu()" class="btn-3d btn-gray py-4 rounded-2xl font-black text-lg text-slate-700">
                            🏠 Về Menu Chính
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize application on page load
        window.onload = function() {
            showMainMenu();
        };
    </script>
</body>
</html>
