            const arr = [...array];

                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;

            });

            if (q.context) {
                // Game 1: Build options list from answer + distractors and shuffle
                const opts = [{ text: q.answer, kanji: q.kanji, isCorrect: true }];
                q.distractors.forEach((d, idx) => {
                    opts.push({ text: d, kanji: q.distractorsKanji[idx] || furi(d), isCorrect: false });
                });
                q.shuffledOptions = shuffleArray(opts);
            } else if (q.sentence || q.question) {
                if (!q._baseOptions) { q._baseOptions = q.options; q._baseCorrect = q.correctIndex; }
                const correct = q._baseOptions[q._baseCorrect];
                q.options = shuffleArray(q._baseOptions);
                q.correctIndex = q.options.indexOf(correct);
            }
            return q;
        }

                if (!q.id) warn('Thiếu id');
                else if (ids.has(q.id)) warn('Trùng id: ' + q.id);
                ids.add(q.id);
                if (!['easy', 'medium', 'hard'].includes(q.level)) warn('level sai: ' + q.id);
                const e = q.explanation || {};
                if (!e.correct || !e.pitfalls || !e.tip) warn('Thiếu explanation.correct/pitfalls/tip: ' + q.id);
            });
            GAME1_DATA.forEach(q => { if (!q.distractors || q.distractors.length !== 3) warn('Game1 cần đúng 3 distractors: ' + q.id); });
            GAME2_DATA.forEach(q => {
                if (!/＿/.test(q.sentence)) warn('Game2 thiếu chỗ trống ＿: ' + q.id);

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

        function setQuestionCount(count) {
            playSound('click');
            gameState.questionCount = count;
            showMainMenu();
        }

        function setDifficulty(diff) {
            playSound('click');
            gameState.difficultyFilter = diff;
            showMainMenu();
        }

        function retryCurrentGame() {
            document.getElementById('hearts-modal').classList.add('hidden');
            startGame(gameState.currentGame);
        }

        function practiceCurrentWrongList() {
            document.getElementById('hearts-modal').classList.add('hidden');
            if (gameState.wrongAnswers.length > 0) {
                startCustomSession(gameState.wrongAnswers);
            } else {
                showMainMenu();
            }
        }

        function startWeakPointsPractice() {
            try {
                const mistakes = JSON.parse(safeGet(KEY_MISTAKES) || '{}');
                const wrongKeys = Object.keys(mistakes);

                if (wrongKeys.length === 0) {
                    showToast("Bạn chưa có từ hay sai nào! Hãy làm bài luyện tập nhé.");
                    return;
                }

                const allQuestions = [...GAME1_DATA, ...GAME2_DATA, ...GAME3_DATA, ...GAME4_DATA];
                const matchedQuestions = allQuestions.filter(q => wrongKeys.includes(q.id || q.answer || q.sentence));

                if (matchedQuestions.length === 0) {
                    showToast("Chưa có đủ dữ liệu từ hay sai.");
                    return;
                }

                startCustomSession(matchedQuestions);
            } catch (e) {
                showToast("Chưa thể tải danh sách câu sai.");
            }
        }

        function startCustomSession(customList) {
            playSound('click');
            gameState.currentGame = 1;
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            gameState.questions = shuffleArray(customList).slice(0, gameState.questionCount).map(prepareQuestion);

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            updateHeaderStats();
            renderQuestion();
        }

        function startGame(gameId) {
            playSound('click');
            gameState.currentGame = gameId;
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            let rawData = [];
            if (gameId === 1) rawData = GAME1_DATA;
            else if (gameId === 2) rawData = GAME2_DATA;
            else if (gameId === 3) rawData = GAME3_DATA;
            else if (gameId === 4) rawData = GAME4_DATA;

            let filtered = rawData;
            if (gameState.difficultyFilter !== 'all') {
                filtered = rawData.filter(q => q.level === gameState.difficultyFilter);
                if (filtered.length === 0) filtered = rawData;
            }

            const shuffled = shuffleArray(filtered);
            gameState.questions = shuffled.slice(0, Math.min(gameState.questionCount, shuffled.length)).map(prepareQuestion);

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            updateHeaderStats();
            renderQuestion();
        }

        function updateHeaderStats() {
            const currentNum = gameState.currentIndex + 1;
            const totalNum = gameState.questions.length;
            const progress = (gameState.currentIndex / totalNum) * 100;

            const progressInner = document.getElementById('progress-inner');
            const progressText = document.getElementById('progress-text');

            progressInner.style.width = `${progress}%`;

            if (progress >= 80) {
                progressInner.className = "h-full rounded-full transition-all duration-300 progress-near-finish";
            } else {
                progressInner.className = "bg-[#58CC02] h-full rounded-full transition-all duration-300";
            }

            progressText.innerText = `Câu ${currentNum} / ${totalNum}`;
            document.getElementById('stat-streak').innerText = gameState.streak;
            document.getElementById('stat-hearts').innerText = gameState.hearts;
            document.getElementById('stat-score').innerText = gameState.score;
        }

        function resetBottomBar() {
            const bottomBar = document.getElementById('bottom-bar');
            bottomBar.className = "border-t-2 border-slate-200 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 transition-colors duration-300 bg-white shrink-0";
            
            document.getElementById('feedback-icon').className = "text-3xl md:text-4xl hidden select-none";
            document.getElementById('feedback-title').innerText = "";
            document.getElementById('feedback-title').className = "text-lg md:text-xl font-black";
            document.getElementById('feedback-diff').innerText = "";
            document.getElementById('explanation-wrapper').classList.add('hidden');
            document.getElementById('feedback-explanation').classList.add('hidden');
            document.getElementById('exp-arrow').innerText = "▼";

            const btnAction = document.getElementById('btn-action');
            btnAction.innerText = "KIỂM TRA";
            btnAction.className = "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";
            btnAction.disabled = true;

            gameState.isAnswerChecked = false;
            gameState.selectedOptionIndex = null;
        }

        function renderQuestion() {
            resetBottomBar();
            updateHeaderStats();

            const container = document.getElementById('game-container');
            const q = gameState.questions[gameState.currentIndex];

            if (!q) {
                showResults();
                return;
            }

            // Set badge level
            const levelBadge = document.getElementById('level-badge');
            const lvlMap = { easy: 'Dễ 🟢', medium: 'Vừa 🟡', hard: 'Khó 🔴' };
            levelBadge.innerText = `${LESSON_CONFIG.jlpt} • ${lvlMap[q.level] || 'N5'}`;

            if (gameState.currentGame === 1) {
                renderGame1(q, container);
            } else if (gameState.currentGame === 2) {
                renderGame2(q, container);
            } else if (gameState.currentGame === 3) {
                renderGame3(q, container);
            } else if (gameState.currentGame === 4) {
                renderGame4(q, container);
            }
        }

        function moveBlockToTarget(poolIdx) {

            gameState.dragPoolBlocks.splice(poolIdx, 1);

        function moveBlockToPool(selectedIdx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');

            const block = gameState.dragSelectedBlocks[selectedIdx];

            gameState.dragPoolBlocks.push(block);
            gameState.dragSelectedBlocks.splice(selectedIdx, 1);

            updateGame3UI();
        }

        function updateGame3UI() {
            const targetArea = document.getElementById('target-area');
            const poolArea = document.getElementById('pool-area');

            if (gameState.dragSelectedBlocks.length === 0) {
                targetArea.innerHTML = `<span id="target-placeholder" class="text-slate-400 font-extrabold text-sm select-none">Chạm các từ bên dưới để ghép câu...</span>`;

                targetArea.innerHTML = gameState.dragSelectedBlocks.map((b, idx) => `

        // Action Button Dispatcher
        function handleActionButton() {
            if (!gameState.isAnswerChecked) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function toggleExplanationDetails() {
            const exp = document.getElementById('feedback-explanation');
            const arrow = document.getElementById('exp-arrow');
            const isHidden = exp.classList.contains('hidden');

            if (isHidden) {
                exp.classList.remove('hidden');
                arrow.innerText = '▲';
            } else {
                exp.classList.add('hidden');
                arrow.innerText = '▼';
            }
        }

        function checkAnswer() {
            gameState.isAnswerChecked = true;
            const q = gameState.questions[gameState.currentIndex];
            let isCorrect = false;

            if (gameState.currentGame === 1) {
                const selectedOpt = q.shuffledOptions[gameState.selectedOptionIndex];
                isCorrect = selectedOpt && selectedOpt.isCorrect;
            } else if (gameState.currentGame === 2 || gameState.currentGame === 4) {
                isCorrect = gameState.selectedOptionIndex === q.correctIndex;
            } else if (gameState.currentGame === 3) {
                const userOrder = gameState.dragSelectedBlocks.map(b => b.text);
                isCorrect = q.acceptableOrders.some(order => 
                    order.length === userOrder.length && order.every((val, i) => val === userOrder[i])
                );
            }

            // UI feedback
            const bottomBar = document.getElementById('bottom-bar');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDiff = document.getElementById('feedback-diff');
            const expWrapper = document.getElementById('explanation-wrapper');
            const expText = document.getElementById('feedback-explanation');
            const btnAction = document.getElementById('btn-action');

            feedbackIcon.classList.remove('hidden');
            expWrapper.classList.remove('hidden');

            const explanationObj = q.explanation || {
                correct: "Chính xác!",
                pitfalls: "Lưu ý cấu trúc câu.",
                tip: "Luyện tập thường xuyên."
            };

            expText.innerHTML = `
                <div class="mb-1 text-emerald-700"><strong>✅ Đáp án:</strong> ${explanationObj.correct}</div>
                <div class="mb-1 text-rose-700"><strong>⚠️ Cạm bẫy:</strong> ${explanationObj.pitfalls}</div>
                <div class="text-amber-700"><strong>💡 Mẹo nhớ:</strong> ${explanationObj.tip}</div>
            `;

            if (isCorrect) {
                playSound('correct');
                gameState.score += 20 + (gameState.streak * 5);
                gameState.correctCount++;
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;

                bottomBar.className = "border-t-2 border-emerald-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 bg-emerald-100 shrink-0";
                feedbackIcon.innerText = "🎉";
                feedbackTitle.innerText = "Chính xác! Tuyệt vời!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-emerald-800";
                btnAction.className = "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";

                // Highlight correct button
                highlightOptions(true, q);
            } else {
                playSound('wrong');
                gameState.streak = 0;
                gameState.hearts--;
                gameState.wrongAnswers.push(q);
                recordMistake(q);

                bottomBar.className = "border-t-2 border-rose-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 bg-rose-100 shrink-0";
                feedbackIcon.innerText = "😅";
                feedbackTitle.innerText = "Chưa chính xác rồi!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-rose-800";
                btnAction.className = "btn-3d btn-amber text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";

                highlightOptions(false, q);
            }

            btnAction.innerText = "TIẾP TỤC";
            updateHeaderStats();

            if (gameState.hearts <= 0) {
                setTimeout(() => {
                    const btnModalRev = document.getElementById('btn-modal-review');
                    if (gameState.wrongAnswers.length > 0) {
                        btnModalRev.classList.remove('hidden');
                    }
                    document.getElementById('hearts-modal').classList.remove('hidden');
                }, 700);
            }
        }

        function highlightOptions(isCorrect, q) {
            if (gameState.currentGame === 1) {
                const grid = document.getElementById('options-grid');
                if (!grid) return;
                Array.from(grid.children).forEach((btn, idx) => {
                    const opt = q.shuffledOptions[idx];
                    if (opt.isCorrect) btn.classList.add('btn-option-correct');
                    else if (idx === gameState.selectedOptionIndex) btn.classList.add('btn-option-wrong');
                });
            } else if (gameState.currentGame === 2 || gameState.currentGame === 4) {
                const grid = document.getElementById('options-grid');
                if (!grid) return;
                Array.from(grid.children).forEach((btn, idx) => {
                    if (idx === q.correctIndex) btn.classList.add('btn-option-correct');
                    else if (idx === gameState.selectedOptionIndex) btn.classList.add('btn-option-wrong');
                });
            } else if (gameState.currentGame === 3) {
                const targetArea = document.getElementById('target-area');
                if (isCorrect) {
                    targetArea.className = "w-full min-h-[90px] p-3 border-2 border-emerald-400 bg-emerald-50 rounded-2xl flex flex-wrap gap-2.5 items-center justify-center mb-6";
                } else {
                    targetArea.className = "w-full min-h-[90px] p-3 border-2 border-rose-400 bg-rose-50 rounded-2xl flex flex-wrap gap-2.5 items-center justify-center mb-6";
                }
            }
        }

        function nextQuestion() {
            gameState.currentIndex++;
            if (gameState.currentIndex < gameState.questions.length && gameState.hearts > 0) {
                renderQuestion();
            } else if (gameState.hearts > 0) {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('bottom-bar').classList.add('hidden');

            const container = document.getElementById('game-container');
            const total = gameState.questions.length;
            const accuracy = Math.round((gameState.correctCount / total) * 100) || 0;

            // Save High Score
            const prevHigh = parseInt(safeGet(KEY_HIGH) || '0', 10);
            if (gameState.score > prevHigh) {
                safeSet(KEY_HIGH, gameState.score.toString());
            }

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-lg py-6 text-center anim-pop">
                    <div class="text-7xl mb-4">🏆</div>
                    <h2 class="text-3xl md:text-4xl font-black text-slate-800 mb-2">Hoàn Thành Bài Luyện!</h2>
                    <p class="text-slate-500 font-bold mb-6">${LESSON_CONFIG.title} - Trình độ ${LESSON_CONFIG.jlpt}</p>

                    <div class="grid grid-cols-2 gap-4 w-full mb-6">
                        <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-extrabold text-amber-700">Điểm số</span>
                            <div class="text-3xl font-black text-amber-600 mt-1">${gameState.score}</div>
                        </div>
                        <div class="bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-extrabold text-emerald-700">Chính xác</span>
                            <div class="text-3xl font-black text-emerald-600 mt-1">${accuracy}%</div>
                        </div>
                        <div class="bg-orange-50 border-2 border-orange-200 p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-extrabold text-orange-700">Chuỗi đúng cao nhất</span>
                            <div class="text-3xl font-black text-orange-600 mt-1">🔥 ${gameState.maxStreak}</div>
                        </div>
                        <div class="bg-purple-50 border-2 border-purple-200 p-4 rounded-2xl text-center">
                            <span class="text-xs uppercase font-extrabold text-purple-700">Số câu đúng</span>
                            <div class="text-3xl font-black text-purple-600 mt-1">${gameState.correctCount} / ${total}</div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${gameState.wrongAnswers.length > 0 ? `
                            <button onclick="practiceCurrentWrongList()" class="btn-3d btn-amber py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                                🎯 Ôn lại ${gameState.wrongAnswers.length} câu vừa sai
                            </button>
                        ` : ''}
                        <button onclick="startGame(gameState.currentGame)" class="btn-3d btn-green py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                            🔄 Chơi lại bài này
                        </button>
                        <button onclick="showMainMenu()" class="btn-3d btn-gray py-3.5 rounded-2xl font-black text-lg text-slate-700">
                            🏠 Về Menu chính
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
