            const arr = [...array];

                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;

                }
            },
            {
                id: "l01_c011", level: "hard",
                speaker: "👤 山田さん",
                question: "「あの人は リーさんですか。」",
                questionAudioText: "あのひとは リーさんですか。",

        // ===== DATA ZONE END =================================================

        // ===== ENGINE CORE ===================================================
        const KEY_HIGH = LESSON_CONFIG.storagePrefix + '_highscore';
        const KEY_MISTAKES = LESSON_CONFIG.storagePrefix + '_mistakes';
        const _memStore = {};
        function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in _memStore) ? _memStore[k] : null; } }
        function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { _memStore[k] = v; } }

        // {漢字|かんじ} -> <ruby>漢字<rt>かんじ</rt></ruby>
        function furi(s) {
            return String(s == null ? '' : s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        (function normalizeData() {
            GAME1_DATA.forEach(q => {
                q.kanji = furi(q.kanji || q.answer);
                q.distractorsKanji = q.distractors.map((d, i) => furi((q.distractorsKanji || [])[i] || d));
            });
            GAME2_DATA.forEach(q => {
                q.sentence = furi(q.sentence);
                q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
            });
            GAME3_DATA.forEach(q => q.blocks.forEach(b => { b.kanji = furi(b.kanji || b.text); }));
            GAME4_DATA.forEach(q => {
                q.question = furi(q.question);
                q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
            });
        })();

        function prepareQuestion(q) {
            if (q.context) {
                q.shuffledOptions = null;
            } else if (q.sentence || q.question) {
                if (!q._baseOptions) { q._baseOptions = q.options; q._baseCorrect = q.correctIndex; }
                const correct = q._baseOptions[q._baseCorrect];
                q.options = shuffleArray(q._baseOptions);
                q.correctIndex = q.options.indexOf(correct);
            }
            return q;
        }

        function validateData() {
            const warn = (m) => console.warn('[DATA]', m);
            const ids = new Set();
            [...GAME1_DATA, ...GAME2_DATA, ...GAME3_DATA, ...GAME4_DATA].forEach(q => {
                if (!q.id) warn('Thiếu id');
                else if (ids.has(q.id)) warn('Trùng id: ' + q.id);
                ids.add(q.id);
                if (!['easy', 'medium', 'hard'].includes(q.level)) warn('level sai: ' + q.id);
                const e = q.explanation || {};
                if (!e.correct || !e.pitfalls || !e.tip) warn('Thiếu explanation: ' + q.id);
            });
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

            if ('speechSynthesis' in window && rawText) {
                window.speechSynthesis.cancel();
                const cleanText = rawText.replace(/<[^>]*>/g, '').replace(/^[0-9]\.\s*/, '').trim();
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);

            try {

                safeSet(KEY_MISTAKES, JSON.stringify(mistakes));
            } catch (e) { console.error("Error saving mistakes", e); }
        }

        function startWeakPointsPractice() {
            try {
                const mistakes = JSON.parse(safeGet(KEY_MISTAKES) || '{}');
                const wrongKeys = Object.keys(mistakes);

                if (wrongKeys.length === 0) {
                    showToast("Bạn chưa có từ hay sai nào! Hãy làm bài luyện tập nhé.");
                    return;
                }

                const allQuestions = [...GAME1_DATA, ...GAME2_DATA, ...GAME3_DATA, ...GAME4_DATA];
                const matchedQuestions = allQuestions.filter(q => wrongKeys.includes(q.id || q.answer || q.sentence));

                if (matchedQuestions.length === 0) {
                    showToast("Chưa có đủ dữ liệu từ hay sai.");
                    return;
                }

                startCustomSession(matchedQuestions);
            } catch (e) {
                showToast("Chưa thể tải danh sách câu sai.");
            }
        }

        function startCustomSession(customList) {
            playSound('click');
            gameState.currentGame = 1;
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            gameState.questions = shuffleArray(customList).slice(0, gameState.questionCount).map(prepareQuestion);

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            updateHeaderStats();
            renderQuestion();
        }

        function startGame(gameId) {
            playSound('click');
            gameState.currentGame = gameId;
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.streak = 0;
            gameState.maxStreak = 0;
            gameState.hearts = 5;
            gameState.wrongAnswers = [];

            let rawData = [];
            if (gameId === 1) rawData = GAME1_DATA;
            else if (gameId === 2) rawData = GAME2_DATA;
            else if (gameId === 3) rawData = GAME3_DATA;
            else if (gameId === 4) rawData = GAME4_DATA;

            let filtered = rawData;
            if (gameState.difficultyFilter !== 'all') {
                filtered = rawData.filter(q => q.level === gameState.difficultyFilter);
                if (filtered.length === 0) filtered = rawData;
            }

            const shuffled = shuffleArray(filtered);
            gameState.questions = shuffled.slice(0, Math.min(gameState.questionCount, shuffled.length)).map(prepareQuestion);

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');

            updateHeaderStats();
            renderQuestion();
        }

        function updateHeaderStats() {
            const currentNum = gameState.currentIndex + 1;
            const totalNum = gameState.questions.length;
            const progress = (gameState.currentIndex / totalNum) * 100;

            const progressInner = document.getElementById('progress-inner');
            const progressText = document.getElementById('progress-text');

            progressInner.style.width = `${progress}%`;

            if (progress >= 80) {
                progressInner.className = "h-full rounded-full transition-all duration-300 progress-near-finish";
                progressText.innerHTML = `Câu ${currentNum} / ${totalNum} <span class="text-amber-500 font-black animate-pulse">🔥 Sắp hoàn thành!</span>`;
            } else {
                progressInner.className = "bg-[#58CC02] h-full rounded-full transition-all duration-300";
                progressText.innerText = `Câu ${currentNum} / ${totalNum}`;
            }

            document.getElementById('stat-streak').innerText = gameState.streak;
            document.getElementById('stat-hearts').innerText = gameState.hearts;
            document.getElementById('stat-score').innerText = gameState.score;
        }

        function renderQuestion() {
            resetBottomBar();
            gameState.selectedOptionIndex = null;
            gameState.dragSelectedBlocks = [];
            gameState.dragPoolBlocks = [];

            const q = gameState.questions[gameState.currentIndex];
            const container = document.getElementById('game-container');

            const levelBadge = document.getElementById('level-badge');
            const levelText = (q.level || "easy").toUpperCase();
            levelBadge.innerText = levelText;
            levelBadge.className = q.level === 'hard' ? "bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md text-xs uppercase font-black" :
                                   q.level === 'medium' ? "bg-amber-100 text-amber-700 px-2 py-0.5 rounded-md text-xs uppercase font-black" :
                                   "bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md text-xs uppercase font-black";

            if (q.context) renderGame1(q, container);
            else if (q.sentence) renderGame2(q, container);
            else if (q.acceptableOrders) {
                gameState.dragPoolBlocks = shuffleArray(q.blocks.map(b => ({ ...b, used: false })));
                gameState.dragSelectedBlocks = [];
                renderGame3(q, container);
            }
            else if (q.question) renderGame4(q, container);
        }

        // Game 1: Từ Vựng
        function renderGame1(q, container) {
            if (!q.shuffledOptions || q.shuffledOptions.length === 0) {
                const options = [
                    { kana: q.answer, kanji: q.kanji, isCorrect: true },
                    ...q.distractors.map((d, idx) => ({ kana: d, kanji: q.distractorsKanji[idx], isCorrect: false }))
                ];
                q.shuffledOptions = shuffleArray(options);
            }

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Chọn từ tương ứng ngữ cảnh</h2>
                    
                    <div class="bg-emerald-50 border-2 border-emerald-200 p-5 md:p-6 rounded-2xl mb-5 w-full text-center shadow-inner">
                        <p class="text-lg md:text-2xl font-extrabold text-emerald-950">"${q.context}"</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full">
                        ${q.shuffledOptions.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectGame1Option(${idx})" class="btn-3d btn-gray p-4 md:p-5 rounded-2xl flex flex-col items-center justify-center text-center border-2 min-h-[90px]">
                                <div class="jp-text-lg">${opt.kanji}</div>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectGame1Option(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;
            const q = gameState.questions[gameState.currentIndex];
            
            q.shuffledOptions.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (i === idx) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });

            setCheckButtonState(true);
            speakJapanese(q.shuffledOptions[idx].kana);
        }

        // Game 2: Ngữ Pháp
        function renderGame2(q, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-3 uppercase tracking-wider">Điền từ vào chỗ trống</h2>

                    <div class="bg-slate-50 border-2 border-slate-200 p-5 md:p-6 rounded-2xl mb-5 w-full text-center shadow-sm">
                        <div id="sentence-display" class="jp-text-xl text-slate-800 leading-relaxed mb-3">
                            ${q.sentence.replace(/＿+/, '<span id="blank-slot" class="inline-block border-b-4 border-emerald-500 min-w-[90px] px-2 text-emerald-600 font-extrabold">＿＿＿</span>')}
                        </div>

                        <div>
                            <button onclick="toggleTranslation()" class="text-xs md:text-sm text-slate-500 underline font-bold hover:text-slate-700 select-none">
                                👁️ <span id="trans-toggle-text">Hiện bản dịch</span>
                            </button>
                            <p id="sentence-translation" class="text-base text-slate-600 font-bold mt-2 hidden italic">"${q.translation}"</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectGame2Option(${idx})" class="btn-3d btn-gray p-3.5 rounded-2xl flex items-center justify-between border-2 min-h-[64px]">
                                <span class="bg-slate-100 text-slate-500 rounded-lg px-2 py-1 font-black text-xs">${idx + 1}</span>
                                <span class="jp-text-lg font-bold text-center flex-1">${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleTranslation() {
            const transEl = document.getElementById('sentence-translation');
            const toggleText = document.getElementById('trans-toggle-text');
            if (transEl.classList.contains('hidden')) {
                transEl.classList.remove('hidden');
                toggleText.innerText = "Ẩn bản dịch";
            } else {
                transEl.classList.add('hidden');
                toggleText.innerText = "Hiện bản dịch";
            }
        }

        function selectGame2Option(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;
            const q = gameState.questions[gameState.currentIndex];

            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) {
                    if (i === idx) btn.classList.add('selected');
                    else btn.classList.remove('selected');
                }
            });

            const blank = document.getElementById('blank-slot');
            if (blank) {
                blank.innerHTML = q.options[idx].kanji;
            }

            setCheckButtonState(true);
            speakJapanese(q.options[idx].text);
        }

        // Game 3: Xếp Câu
        function renderGame3(q, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Xếp các khối từ thành câu hoàn chỉnh</h2>
                    
                    <div class="bg-purple-50 border-2 border-purple-200 p-4 md:p-5 rounded-2xl mb-4 w-full text-center shadow-inner">
                        <p class="text-base md:text-xl font-extrabold text-purple-950">"${q.vietnamese}"</p>
                    </div>

                    <div id="target-zone" class="w-full min-h-[76px] p-3 mb-4 bg-slate-50 border-2 border-dashed border-slate-300 rounded-2xl flex flex-wrap gap-2 items-center justify-center shadow-inner">
                        ${gameState.dragSelectedBlocks.length === 0 ? '<span class="text-slate-400 font-bold text-sm select-none">Chạm chọn các thẻ chữ bên dưới...</span>' : ''}
                        ${gameState.dragSelectedBlocks.map((blk, i) => `
                            <button onclick="deselectBlock(${i})" class="btn-3d btn-purple px-3.5 py-2 rounded-xl text-base font-bold anim-pop">
                                ${blk.kanji}
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex flex-wrap gap-2.5 justify-center w-full">
                        ${gameState.dragPoolBlocks.map((blk, i) => `
                            <button onclick="selectPoolBlock(${i})" class="btn-3d btn-gray px-3.5 py-2.5 rounded-xl text-base font-bold border-2 ${blk.used ? 'opacity-30 pointer-events-none' : ''}">
                                ${blk.kanji}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectPoolBlock(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            const blk = gameState.dragPoolBlocks[idx];
            if (blk.used) return;

            blk.used = true;
            gameState.dragSelectedBlocks.push(blk);

            const q = gameState.questions[gameState.currentIndex];
            renderGame3(q, document.getElementById('game-container'));
            setCheckButtonState(gameState.dragSelectedBlocks.length > 0);
            speakJapanese(blk.text);
        }

        function deselectBlock(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            const removed = gameState.dragSelectedBlocks.splice(idx, 1)[0];
            removed.used = false;

            const q = gameState.questions[gameState.currentIndex];
            renderGame3(q, document.getElementById('game-container'));
            setCheckButtonState(gameState.dragSelectedBlocks.length > 0);
        }

        // Game 4: Hội Thoại
        function renderGame4(q, container) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-2xl">
                    <h2 class="text-xs md:text-sm font-extrabold text-slate-400 mb-2 uppercase tracking-wider">Chọn câu đáp lời phù hợp</h2>
                    
                    <div class="bg-amber-50 border-2 border-amber-200 p-4 md:p-5 rounded-2xl mb-4 w-full text-left shadow-sm">
                        <div class="text-xs font-black text-amber-700 mb-1">${q.speaker || '👤 Người đối thoại'}</div>
                        <div class="jp-text-lg font-extrabold text-amber-950 flex items-center justify-between gap-2">
                            <span>${q.question}</span>
                            <button onclick="speakJapanese('${(q.questionAudioText || q.question).replace(/'/g, "\\'")}')" class="text-xl p-1 hover:bg-amber-100 rounded-lg shrink-0">🔊</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${q.options.map((opt, idx) => `
                            <button id="opt-${idx}" onclick="selectGame4Option(${idx})" class="btn-3d btn-gray p-4 rounded-2xl flex items-center gap-3 text-left border-2 min-h-[60px]">
                                <span class="bg-amber-100 text-amber-800 rounded-lg px-2.5 py-1 font-black text-xs shrink-0">${idx + 1}</span>
                                <span class="jp-text-lg font-bold flex-1">${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            if (q.questionAudioText) {
                setTimeout(() => speakJapanese(q.questionAudioText), 300);
            }
        }

        function selectGame4Option(idx) {
            if (gameState.isAnswerChecked) return;
            playSound('click');
            gameState.selectedOptionIndex = idx;
            const q = gameState.questions[gameState.currentIndex];

            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) {
                    if (i === idx) btn.classList.add('selected');
                    else btn.classList.remove('selected');
                }
            });

            setCheckButtonState(true);
            speakJapanese(q.options[idx].text);
        }

        // Process Action Engine
        function handleActionButton() {
            if (!gameState.isAnswerChecked) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function checkAnswer() {
            gameState.isAnswerChecked = true;
            const q = gameState.questions[gameState.currentIndex];
            let isCorrect = false;

            if (q.context) {
                const selectedOpt = q.shuffledOptions[gameState.selectedOptionIndex];
                isCorrect = selectedOpt && selectedOpt.isCorrect;

                q.shuffledOptions.forEach((opt, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (btn) {
                        if (opt.isCorrect) btn.className = "btn-3d btn-option-correct p-4 md:p-5 rounded-2xl flex flex-col items-center justify-center text-center border-2 min-h-[90px]";
                        else if (idx === gameState.selectedOptionIndex && !isCorrect) btn.className = "btn-3d btn-option-wrong p-4 md:p-5 rounded-2xl flex flex-col items-center justify-center text-center border-2 min-h-[90px]";
                    }
                });
            } else if (q.sentence) {
                isCorrect = gameState.selectedOptionIndex === q.correctIndex;

                q.options.forEach((_, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (btn) {
                        if (idx === q.correctIndex) btn.className = "btn-3d btn-option-correct p-3.5 rounded-2xl flex items-center justify-between border-2 min-h-[64px]";
                        else if (idx === gameState.selectedOptionIndex && !isCorrect) btn.className = "btn-3d btn-option-wrong p-3.5 rounded-2xl flex items-center justify-between border-2 min-h-[64px]";
                    }
                });
            } else if (q.acceptableOrders) {
                const userOrder = gameState.dragSelectedBlocks.map(b => b.text);
                isCorrect = q.acceptableOrders.some(order => 
                    order.length === userOrder.length && order.every((val, idx) => val === userOrder[idx])
                );

                const targetZone = document.getElementById('target-zone');
                if (targetZone) {
                    targetZone.className = `w-full min-h-[76px] p-3 mb-4 border-2 rounded-2xl flex flex-wrap gap-2 items-center justify-center ${isCorrect ? 'bg-emerald-50 border-emerald-500' : 'bg-red-50 border-red-500'}`;
                }
            } else if (q.question) {
                isCorrect = gameState.selectedOptionIndex === q.correctIndex;

                q.options.forEach((_, idx) => {
                    const btn = document.getElementById(`opt-${idx}`);
                    if (btn) {
                        if (idx === q.correctIndex) btn.className = "btn-3d btn-option-correct p-4 rounded-2xl flex items-center gap-3 text-left border-2 min-h-[60px]";
                        else if (idx === gameState.selectedOptionIndex && !isCorrect) btn.className = "btn-3d btn-option-wrong p-4 rounded-2xl flex items-center gap-3 text-left border-2 min-h-[60px]";
                    }
                });
            }

            showFeedback(isCorrect, q);
        }

        function showFeedback(isCorrect, q) {
            const bottomBar = document.getElementById('bottom-bar');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDiff = document.getElementById('feedback-diff');
            const explanationWrapper = document.getElementById('explanation-wrapper');
            const feedbackExplanation = document.getElementById('feedback-explanation');
            const btnAction = document.getElementById('btn-action');

            feedbackIcon.classList.remove('hidden');

            if (isCorrect) {
                playSound('correct');
                gameState.score += (q.level === 'hard' ? 30 : q.level === 'medium' ? 20 : 10);
                gameState.correctCount++;
                gameState.streak++;
                if (gameState.streak > gameState.maxStreak) gameState.maxStreak = gameState.streak;

                bottomBar.className = "border-t-2 border-emerald-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 transition-colors duration-300 bg-emerald-100 shrink-0";
                feedbackIcon.innerText = "🎉";
                feedbackTitle.innerText = "Chính xác!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-emerald-800";
                feedbackDiff.innerText = `+${q.level === 'hard' ? 30 : q.level === 'medium' ? 20 : 10} Điểm!`;
                feedbackDiff.className = "text-sm font-bold text-emerald-700";
            } else {
                playSound('wrong');
                gameState.hearts--;
                gameState.streak = 0;
                gameState.wrongAnswers.push(q);
                recordMistake(q);

                bottomBar.className = "border-t-2 border-rose-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 transition-colors duration-300 bg-rose-100 shrink-0";
                feedbackIcon.innerText = "😅";
                feedbackTitle.innerText = "Chưa đúng rồi!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-rose-800";
                feedbackDiff.innerText = "Mất 1 ❤️";
                feedbackDiff.className = "text-sm font-bold text-rose-700";
            }

            const exp = q.explanation || {};
            feedbackExplanation.innerHTML = `
                <div class="space-y-1.5 text-left">
                    <p><strong class="text-emerald-700">✓ Giải thích:</strong> ${exp.correct || 'Giải thích đáp án đúng.'}</p>
                    <p><strong class="text-rose-700">⚠️ Lưu ý:</strong> ${exp.pitfalls || 'Tránh các lỗi nhầm lẫn.'}</p>
                    <p><strong class="text-amber-700">💡 Mẹo:</strong> ${exp.tip || 'Nhớ quy tắc ngữ cảnh.'}</p>
                </div>
            `;
            explanationWrapper.classList.remove('hidden');

            btnAction.innerText = "TIẾP TỤC";
            btnAction.className = isCorrect 
                ? "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto"
                : "btn-3d btn-amber text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";

            btnAction.disabled = false;
            updateHeaderStats();

            if (gameState.hearts <= 0) {
                setTimeout(() => {
                    const reviewBtn = document.getElementById('btn-modal-review');
                    if (gameState.wrongAnswers.length > 0) reviewBtn.classList.remove('hidden');
                    else reviewBtn.classList.add('hidden');
                    document.getElementById('hearts-modal').classList.remove('hidden');
                }, 800);
            }
        }

        function nextQuestion() {
            if (gameState.hearts <= 0) {
                return;
            }

            gameState.currentIndex++;
            if (gameState.currentIndex >= gameState.questions.length) {
                showSummaryScreen();
            } else {
                renderQuestion();
            }
        }

        function showSummaryScreen() {
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('bottom-bar').classList.add('hidden');

            const high = parseInt(safeGet(KEY_HIGH) || '0', 10);
            if (gameState.score > high) {
                safeSet(KEY_HIGH, gameState.score.toString());
            }

            const container = document.getElementById('game-container');
            const accuracy = Math.round((gameState.correctCount / gameState.questions.length) * 100);

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center w-full max-w-md py-6 px-4 text-center anim-pop">
                    <div class="text-6xl md:text-7xl mb-4 select-none">
                        ${accuracy >= 80 ? '🏆' : accuracy >= 50 ? '🌟' : '💪'}
                    </div>

                    <h2 class="text-3xl md:text-4xl font-black text-slate-800 mb-2">
                        ${accuracy >= 80 ? 'Xuất sắc!' : accuracy >= 50 ? 'Khá lắm!' : 'Cố gắng lên!'}
                    </h2>
                    <p class="text-slate-500 font-bold mb-6">Bạn đã hoàn thành bài luyện tập ${LESSON_CONFIG.title}</p>

                    <div class="grid grid-cols-2 gap-3 w-full mb-6">
                        <div class="bg-amber-50 border-2 border-amber-200 p-3.5 rounded-2xl text-center">
                            <span class="text-xs font-black text-amber-600 uppercase block">Tổng điểm</span>
                            <span class="text-2xl font-black text-amber-800">${gameState.score}</span>
                        </div>
                        <div class="bg-emerald-50 border-2 border-emerald-200 p-3.5 rounded-2xl text-center">
                            <span class="text-xs font-black text-emerald-600 uppercase block">Chính xác</span>
                            <span class="text-2xl font-black text-emerald-800">${accuracy}%</span>
                        </div>
                        <div class="bg-orange-50 border-2 border-orange-200 p-3.5 rounded-2xl text-center">
                            <span class="text-xs font-black text-orange-600 uppercase block">Chuỗi đúng</span>
                            <span class="text-2xl font-black text-orange-800">${gameState.maxStreak} 🔥</span>
                        </div>
                        <div class="bg-rose-50 border-2 border-rose-200 p-3.5 rounded-2xl text-center">
                            <span class="text-xs font-black text-rose-600 uppercase block">Câu sai</span>
                            <span class="text-2xl font-black text-rose-800">${gameState.wrongAnswers.length} 🎯</span>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 w-full">
                        ${gameState.wrongAnswers.length > 0 ? `
                            <button onclick="practiceCurrentWrongList()" class="btn-3d btn-blue py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                                🎯 Ôn lại ${gameState.wrongAnswers.length} câu vừa sai
                            </button>
                        ` : ''}
                        <button onclick="startGame(gameState.currentGame)" class="btn-3d btn-green py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                            🔄 Chơi lại
                        </button>
                        <button onclick="showMainMenu()" class="btn-3d btn-gray py-3.5 rounded-2xl font-black text-lg text-slate-700">
                            🏠 Về Menu chính
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
