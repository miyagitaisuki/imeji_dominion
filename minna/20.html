<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Nội dung bài: data/minna/20.json. Engine dùng chung: assets/js/engine.js. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minna no Nihongo – Bài 20 | Luyện tập IMEJI日本語教室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/imeji-brand.css">
    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/lesson.css">
</head>
<body class="bg-slate-900 text-slate-800 flex flex-col justify-between min-h-screen">

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-warning-500 text-white font-extrabold px-6 py-3 rounded-2xl shadow-xl flex items-center gap-2 text-base md:text-lg opacity-0 pointer-events-none transform -translate-y-4">
        <span>⚠️</span> <span id="toast-message">Vui lòng chọn đáp án</span>
    </div>

    <!-- 2. Tích cực hóa Modal Hết Tim -->
    <div id="hearts-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl border-4 border-warning-200 anim-pop">
            <div class="text-6xl mb-3">🎯</div>
            <h2 class="text-2xl md:text-3xl font-black text-warning-600 mb-2">Còn vài điểm cần luyện thêm!</h2>
            <p class="text-base text-slate-600 font-bold mb-6">Mỗi lần vấp ngã là một bước tiến gần hơn tới JLPT <span id="modal-jlpt">N5</span>. Hãy rèn luyện lại nhé!</p>
            <div class="flex flex-col gap-3">
                <button id="btn-modal-review" onclick="practiceCurrentWrongList()" class="btn-3d btn-blue py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider hidden">
                    🎯 Ôn lại câu vừa sai
                </button>
                <button onclick="retryCurrentGame()" class="btn-3d btn-green py-3.5 rounded-2xl font-black text-lg uppercase tracking-wider">
                    🔄 Thử lại lượt này
                </button>
                <button onclick="showMainMenu()" class="btn-3d btn-gray py-3.5 rounded-2xl font-black text-lg text-slate-700">
                    🏠 Về Menu chính
                </button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div id="app-root" class="w-full max-w-5xl mx-auto bg-white min-h-screen flex flex-col justify-between shadow-2xl overflow-hidden relative">

        <!-- 10. Header tối ưu hóa cho Mobile -->
        <header id="top-bar" class="px-4 md:px-8 py-3.5 border-b-2 border-slate-100 flex items-center justify-between bg-white shrink-0 hidden select-none">
            <!-- Back Button -->
            <button id="btn-back" onclick="showMainMenu()" aria-label="Quay lại" class="btn-3d min-w-[44px] min-h-[44px] p-2.5 rounded-2xl border-2 border-slate-200 hover:bg-slate-100 flex items-center justify-center text-slate-500 shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>

            <!-- Progress Bar with Near Completion Effect (Feature 1) -->
            <div class="flex-1 max-w-md mx-3 md:mx-6">
                <div class="flex justify-between items-center mb-1 text-xs md:text-sm font-extrabold text-slate-500">
                    <span id="progress-text">Câu 1 / 5</span>
                    <span id="level-badge" class="bg-primary-100 text-primary-700 px-2 py-0.5 rounded-md text-xs uppercase font-black">N5</span>
                </div>
                <div class="w-full bg-slate-100 h-3.5 md:h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                    <div id="progress-inner" class="bg-primary-600 h-full rounded-full transition-all duration-300 w-0"></div>
                </div>
            </div>

            <!-- Stats Header (Streak ẩn trên mobile để gọn gàng - Feature 10) -->
            <div class="flex items-center gap-2 md:gap-5 text-base md:text-xl font-black shrink-0">
                <div class="hidden md:flex items-center gap-1 text-warning-500" title="Chuỗi đúng">
                    <span>🔥</span>
                    <span id="stat-streak">0</span>
                </div>
                <div class="flex items-center gap-1 text-danger-500" title="Số tim còn lại">
                    <span>❤️</span>
                    <span id="stat-hearts">5</span>
                </div>
                <div class="flex items-center gap-1 text-warning-500" title="Điểm số">
                    <span>⭐</span>
                    <span id="stat-score">0</span>
                </div>
                <button id="btn-sound" onclick="toggleSound()" aria-label="Âm thanh" class="min-w-[44px] min-h-[44px] p-2 hover:bg-slate-100 rounded-xl text-xl select-none flex items-center justify-center">
                    🔊
                </button>
            </div>
        </header>

        <!-- Main Game Interactive Content Body -->
        <main id="game-container" class="flex-1 p-4 md:p-8 flex flex-col items-center justify-center relative bg-white">
            <!-- Dynamic game screens rendered here -->
        </main>

        <!-- 5. Bottom Footer Feedback Bar gọn gàng, hỗ trợ [Giải thích ▼] -->
        <footer id="bottom-bar" class="border-t-2 border-slate-200 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 transition-colors duration-300 bg-white shrink-0 hidden">
            <!-- Feedback Content Box -->
            <div id="feedback-content" class="flex flex-col md:flex-row items-start md:items-center gap-3 max-w-3xl w-full">
                <div class="flex items-center gap-3">
                    <div id="feedback-icon" class="text-3xl md:text-4xl hidden select-none"></div>
                    <div>
                        <div id="feedback-title" class="text-lg md:text-xl font-black"></div>
                        <div id="feedback-diff" class="text-sm font-bold"></div>
                    </div>
                </div>

                <!-- Collapsible explanation toggle -->
                <div id="explanation-wrapper" class="hidden w-full md:w-auto md:ml-2">
                    <button id="btn-toggle-exp" onclick="toggleExplanationDetails()" class="text-xs md:text-sm font-extrabold text-slate-600 bg-white/80 hover:bg-white border border-slate-300 px-3 py-1.5 rounded-xl flex items-center gap-1">
                        💡 Giải thích <span id="exp-arrow">▼</span>
                    </button>
                    <div id="feedback-explanation" class="hidden mt-2 p-3 bg-white/90 border border-slate-200 rounded-xl text-xs md:text-sm text-slate-700 font-semibold max-h-36 overflow-y-auto shadow-sm"></div>
                </div>
            </div>

            <!-- Action Check / Next Button -->
            <button id="btn-action" onclick="handleActionButton()" disabled class="btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto">
                KIỂM TRA
            </button>
        </footer>

    </div>

    <script src="../assets/js/loader.js" data-lesson="../data/minna/20.json"></script>
</body>
</html>
