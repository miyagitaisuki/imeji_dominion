<!DOCTYPE html>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0F172A;
            font-family: 'Nunito', 'Noto Sans JP', sans-serif;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        button:focus-visible, a:focus-visible, [tabindex="0"]:focus-visible {
            outline: 3px solid #1CB0F6 !important;
            outline-offset: 3px !important;
        }

        .select-none {
            user-select: none;
            -webkit-user-select: none;
        }

        ruby {
            ruby-position: over;
            font-size: inherit;
        }
        rt {
            font-size: 0.55em;
            font-weight: 700;
            color: #475569;
            line-height: 1;
        }

        .jp-text-lg {
            font-size: clamp(1.25rem, 2.5vw, 2.25rem);
            font-weight: 700;
            line-height: 1.4;
        }
        .jp-text-xl {
            font-size: clamp(1.5rem, 3.5vw, 2.75rem);
            font-weight: 700;
            line-height: 1.4;
        }

        .btn-3d {
            transition: all 0.1s ease;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important;
        }
        
        .btn-green {
            background-color: #58CC02;
            border-bottom: 4px solid #46A302;
            color: #FFFFFF;
        }
        .btn-green:hover:not(:disabled) {
            background-color: #61E002;
        }
        .btn-green:disabled {
            background-color: #E5E5E5;
            border-bottom-color: #CECECE;
            color: #AFB5C0;
            cursor: not-allowed;
        }

        .btn-blue {
            background-color: #1CB0F6;
            border-bottom: 4px solid #1899D6;
            color: #FFFFFF;
        }
        .btn-blue:hover:not(:disabled) {
            background-color: #24BDFF;
        }

        .btn-purple {
            background-color: #A855F7;
            border-bottom: 4px solid #7E22CE;
            color: #FFFFFF;
        }
        .btn-purple:hover:not(:disabled) {
            background-color: #B666FF;
        }

        .btn-amber {
            background-color: #F59E0B;
            border-bottom: 4px solid #D97706;
            color: #FFFFFF;
        }
        .btn-amber:hover:not(:disabled) {
            background-color: #FBBF24;
        }

        .btn-gray {
            background-color: #FFFFFF;
            border: 2px solid #E2E8F0;
            border-bottom: 4px solid #CBD5E1;
            color: #334155;
        }
        .btn-gray:hover:not(:disabled) {
            background-color: #F8FAFC;
        }
        .btn-gray.selected {
            background-color: #E0F2FE;
            border-color: #38BDF8;
            border-bottom-color: #0284C7;
            color: #0369A1;
        }

        .btn-option-correct {
            background-color: #D7FFB8 !important;
            border-color: #58CC02 !important;
            border-bottom-color: #46A302 !important;
            color: #2B6600 !important;
        }
        .btn-option-wrong {
            background-color: #FFDFE0 !important;
            border-color: #FF4B4B !important;
            border-bottom-color: #EA2B2B !important;
            color: #A30000 !important;
        }

        @keyframes pulse-gold {
            0%, 100% { background-color: #F59E0B; }
            50% { background-color: #FBBF24; }
        }
        .progress-near-finish {
            animation: pulse-gold 1.5s infinite ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .anim-pop { animation: pop 0.25s ease-in-out; }
        .anim-shake { animation: shake 0.35s ease-in-out; }

        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // =====================================================================

        // ===== GAME ENGINE LOGIC =====
        const KEY_HIGH = LESSON_CONFIG.storagePrefix + '_highscore';
        const KEY_MISTAKES = LESSON_CONFIG.storagePrefix + '_mistakes';
        const _memStore = {};
        
        function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return (k in _memStore) ? _memStore[k] : null; } }
        function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { _memStore[k] = v; } }

        function furi(s) {
            return String(s == null ? '' : s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
        }

        // Normalize furigana tags on load
        (function normalizeData() {
            GAME1_DATA.forEach(q => {
                q.kanji = furi(q.kanji || q.answer);
                if (q.distractorsKanji) {
                    q.distractorsKanji = q.distractorsKanji.map(furi);
                }
            });
            GAME2_DATA.forEach(q => {
                q.sentence = furi(q.sentence);
                if (q.options) {
                    q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
                }
            });
            GAME3_DATA.forEach(q => {
                if (q.blocks) {
                    q.blocks.forEach(b => { b.kanji = furi(b.kanji || b.text); });
                }
            });
            GAME4_DATA.forEach(q => {
                q.question = furi(q.question);
                if (q.options) {
                    q.options.forEach(o => { o.kanji = furi(o.kanji || o.text); });
                }
            });
        })();

        // State variables
        let soundEnabled = true;
        let currentMode = null; // 1, 2, 3, 4, 'mix', 'review'
        let currentQuestions = [];
        let currentIndex = 0;
        let hearts = 5;
        let score = 0;
        let streak = 0;
        let selectedOption = null;
        let currentSentenceBlocks = []; // for Game 3
        let wrongQuestions = JSON.parse(safeGet(KEY_MISTAKES) || "[]");

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            if (btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
            showToast(soundEnabled ? "Đã bật âm thanh" : "Đã tắt âm thanh");
        }

        function speakJP(text) {
            if (!soundEnabled || !text) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/\{([^|{}]+)\|[^{}]+\}/g, '$1');
                const u = new SpeechSynthesisUtterance(cleanText);
                u.lang = 'ja-JP';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            if (!toast || !msgEl) return;
            msgEl.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
            }, 2000);
        }

            document.getElementById('modal-jlpt').textContent = LESSON_CONFIG.jlpt;

            const currentNum = Math.min(currentIndex + 1, total);

            if (pct >= 80) {
                barInner.classList.add('progress-near-finish');
            } else {
                barInner.classList.remove('progress-near-finish');
            }
        }

                        <button onclick="startGame('mix')" class="btn-3d btn-gray py-4 px-6 rounded-2xl font-black text-lg flex items-center justify-between text-left text-indigo-600 border-indigo-200 hover:bg-indigo-50 shadow-sm">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🎲</span>
                                <div>
                                    <div>Luyện tập tổng hợp</div>
                                    <div class="text-xs font-bold text-slate-500">Trộn ngẫu nhiên cả 4 dạng câu hỏi</div>
                                </div>
                            </div>
                            <span class="text-xl">➔</span>
                        </button>

                        ${wrongQuestions.length > 0 ? `
                        <button onclick="startGame('review')" class="btn-3d btn-gray py-3.5 px-6 rounded-2xl font-black text-base flex items-center justify-between text-red-600 border-red-200 hover:bg-red-50">
                            <div class="flex items-center gap-2">
                                <span>🎯</span>
                                <span>Ôn lại ${wrongQuestions.length} câu làm sai</span>

                            <span>➔</span>
                        </button>

        function startGame(mode) {
            currentMode = mode;
            currentIndex = 0;
            hearts = 5;
            score = 0;
            streak = 0;

            if (mode === 1) currentQuestions = shuffleArray(GAME1_DATA).slice(0, 10);
            else if (mode === 2) currentQuestions = shuffleArray(GAME2_DATA).slice(0, 10);
            else if (mode === 3) currentQuestions = shuffleArray(GAME3_DATA).slice(0, 10);
            else if (mode === 4) currentQuestions = shuffleArray(GAME4_DATA).slice(0, 10);
            else if (mode === 'mix') {
                const q1 = shuffleArray(GAME1_DATA).slice(0, 3).map(q => ({...q, _gameType: 1}));
                const q2 = shuffleArray(GAME2_DATA).slice(0, 3).map(q => ({...q, _gameType: 2}));
                const q3 = shuffleArray(GAME3_DATA).slice(0, 2).map(q => ({...q, _gameType: 3}));
                const q4 = shuffleArray(GAME4_DATA).slice(0, 2).map(q => ({...q, _gameType: 4}));
                currentQuestions = shuffleArray([...q1, ...q2, ...q3, ...q4]);
            } else if (mode === 'review') {
                wrongQuestions = JSON.parse(safeGet(KEY_MISTAKES) || "[]");
                if (wrongQuestions.length === 0) {
                    showToast("Bạn không có câu sai nào!");
                    return;
                }
                currentQuestions = shuffleArray([...wrongQuestions]);
            }

            document.getElementById('top-bar').classList.remove('hidden');
            document.getElementById('bottom-bar').classList.remove('hidden');
            resetBottomBar();
            renderQuestion();
            updateTopBar();
        }

        function resetBottomBar() {
            const bottomBar = document.getElementById('bottom-bar');

            document.getElementById('feedback-icon').className = "text-3xl md:text-4xl hidden select-none";
            document.getElementById('feedback-title').textContent = "";
            document.getElementById('feedback-diff').textContent = "";
            document.getElementById('explanation-wrapper').classList.add('hidden');
            document.getElementById('feedback-explanation').classList.add('hidden');
            document.getElementById('exp-arrow').textContent = "▼";

            const btnAction = document.getElementById('btn-action');
            btnAction.textContent = "KIỂM TRA";
            btnAction.className = "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";
            btnAction.disabled = true;
        }

        function renderQuestion() {
            resetBottomBar();
            selectedOption = null;
            currentSentenceBlocks = [];

            const container = document.getElementById('game-container');
            const q = currentQuestions[currentIndex];
            if (!q) {
                showResults();
                return;
            }

            let type = currentMode;
            if (currentMode === 'mix' || currentMode === 'review') {
                type = q._gameType || (q.context ? 1 : q.sentence ? 2 : q.vietnamese ? 3 : 4);
            }

            if (type === 1) renderGame1(container, q);
            else if (type === 2) renderGame2(container, q);
            else if (type === 3) renderGame3(container, q);
            else if (type === 4) renderGame4(container, q);
        }

        // --- GAME 1: VOCABULARY ---
        function renderGame1(container, q) {
            if (!q.shuffledOptions) {
                const options = [
                    { text: q.answer, kanji: q.kanji, isCorrect: true },
                    ...q.distractors.map((d, idx) => ({
                        text: d,
                        kanji: (q.distractorsKanji && q.distractorsKanji[idx]) ? q.distractorsKanji[idx] : furi(d),
                        isCorrect: false
                    }))
                ];
                q.shuffledOptions = shuffleArray(options);
            }

            container.innerHTML = `
                <div class="w-full max-w-2xl mx-auto flex flex-col items-center text-center">
                    <div class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Game 1: Chọn từ vựng đúng</div>
                    <div class="jp-text-lg font-black text-slate-800 bg-slate-50 p-6 rounded-3xl border-2 border-slate-200 w-full mb-6 shadow-sm">
                        "${q.context}"
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full">
                        ${q.shuffledOptions.map((opt, i) => `
                            <button id="opt-${i}" onclick="selectOptionGame1(${i})" class="btn-3d btn-gray py-4 px-5 rounded-2xl text-lg md:text-xl font-black text-center flex items-center justify-center min-h-[64px]">
                                <span>${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectOptionGame1(index) {
            const q = currentQuestions[currentIndex];
            q.shuffledOptions.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) btn.classList.remove('selected');
            });

            const selectedBtn = document.getElementById(`opt-${index}`);
            if (selectedBtn) selectedBtn.classList.add('selected');

            selectedOption = index;
            document.getElementById('btn-action').disabled = false;
            
            const opt = q.shuffledOptions[index];
            speakJP(opt.text);
        }

        // --- GAME 2: GRAMMAR ---
        function renderGame2(container, q) {
            container.innerHTML = `
                <div class="w-full max-w-2xl mx-auto flex flex-col items-center text-center">
                    <div class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Game 2: Điền ngữ pháp</div>
                    <div class="jp-text-xl font-black text-slate-800 bg-blue-50/60 p-6 rounded-3xl border-2 border-blue-100 w-full mb-2 shadow-sm leading-relaxed" id="sentence-display">
                        ${q.sentence}
                    </div>
                    <div class="text-sm font-bold text-slate-500 mb-6">${q.translation}</div>

                    <div class="grid grid-cols-2 gap-3.5 w-full max-w-md">
                        ${q.options.map((opt, i) => `
                            <button id="opt-${i}" onclick="selectOptionGame2(${i})" class="btn-3d btn-gray py-4 px-4 rounded-2xl text-xl font-black text-center flex items-center justify-center">
                                <span>${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectOptionGame2(index) {
            const q = currentQuestions[currentIndex];
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) btn.classList.remove('selected');
            });

            const selectedBtn = document.getElementById(`opt-${index}`);
            if (selectedBtn) selectedBtn.classList.add('selected');

            selectedOption = index;
            document.getElementById('btn-action').disabled = false;

            const filledSentence = q.sentence.replace('＿', `<span class="underline text-blue-600 font-extrabold px-1">${q.options[index].kanji}</span>`);
            document.getElementById('sentence-display').innerHTML = filledSentence;

            speakJP(q.options[index].text);
        }

        // --- GAME 3: SENTENCE ARRANGEMENT ---
        function renderGame3(container, q) {
            if (!q.shuffledBlocks) {
                q.shuffledBlocks = shuffleArray([...q.blocks]);
            }

            container.innerHTML = `
                <div class="w-full max-w-2xl mx-auto flex flex-col items-center text-center">
                    <div class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Game 3: Ghép câu hoàn chỉnh</div>
                    <div class="text-lg md:text-xl font-extrabold text-slate-700 bg-slate-50 p-4 rounded-2xl border border-slate-200 w-full mb-6">
                        "${q.vietnamese}"
                    </div>

                    <!-- Target Sentence Drop Area -->
                    <div id="target-area" class="w-full min-h-[72px] bg-slate-100/80 rounded-2xl border-2 border-dashed border-slate-300 p-3 flex flex-wrap items-center justify-center gap-2 mb-6 transition-all">
                        <span id="target-placeholder" class="text-slate-400 font-bold text-sm select-none">Chạm các từ bên dưới để ghép câu...</span>
                    </div>

                    <!-- Source Blocks -->
                    <div id="source-area" class="flex flex-wrap items-center justify-center gap-2.5 w-full">
                        ${q.shuffledBlocks.map((blk, i) => `
                            <button id="block-${i}" onclick="toggleBlockGame3(${i})" class="btn-3d btn-gray py-3 px-4 rounded-xl text-base md:text-lg font-black flex items-center">
                                <span>${blk.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleBlockGame3(index) {
            const q = currentQuestions[currentIndex];
            const blk = q.shuffledBlocks[index];

            const existingIndex = currentSentenceBlocks.findIndex(b => b.originalIndex === index);
            if (existingIndex >= 0) {
                // Remove from target
                currentSentenceBlocks.splice(existingIndex, 1);
            } else {
                // Add to target
                currentSentenceBlocks.push({ ...blk, originalIndex: index });
                speakJP(blk.text);
            }

            updateGame3UI();
        }

        function updateGame3UI() {
            const q = currentQuestions[currentIndex];
            const targetArea = document.getElementById('target-area');
            const placeholder = document.getElementById('target-placeholder');

            if (currentSentenceBlocks.length === 0) {
                targetArea.innerHTML = `<span id="target-placeholder" class="text-slate-400 font-bold text-sm select-none">Chạm các từ bên dưới để ghép câu...</span>`;
            } else {
                targetArea.innerHTML = currentSentenceBlocks.map((blk) => `
                    <button onclick="toggleBlockGame3(${blk.originalIndex})" class="btn-3d btn-blue py-2.5 px-4 rounded-xl text-base md:text-lg font-black anim-pop">
                        <span>${blk.kanji}</span>
                    </button>
                `).join('');
            }

            q.shuffledBlocks.forEach((_, i) => {
                const btn = document.getElementById(`block-${i}`);
                const isUsed = currentSentenceBlocks.some(b => b.originalIndex === i);
                if (btn) {
                    btn.style.visibility = isUsed ? 'hidden' : 'visible';
                }
            });

            document.getElementById('btn-action').disabled = currentSentenceBlocks.length === 0;
        }

        // --- GAME 4: CONVERSATION ---
        function renderGame4(container, q) {
            container.innerHTML = `
                <div class="w-full max-w-2xl mx-auto flex flex-col items-center">
                    <div class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 text-center">Game 4: Phản hồi hội thoại</div>
                    
                    <!-- Dialogue Question Card -->
                    <div class="w-full bg-amber-50/80 border-2 border-amber-200 rounded-3xl p-5 md:p-6 mb-6 shadow-sm">
                        <div class="text-xs font-black text-amber-700 uppercase tracking-wider mb-1">${q.speaker}</div>
                        <div class="jp-text-lg font-black text-slate-800 flex items-center justify-between gap-3">
                            <span>${q.question}</span>
                            <button onclick="speakJP('${q.questionAudioText || q.question}')" class="min-w-[40px] h-[40px] bg-amber-200/80 hover:bg-amber-300 rounded-full flex items-center justify-center text-lg shrink-0">
                                🔊
                            </button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="flex flex-col gap-3 w-full">
                        ${q.options.map((opt, i) => `
                            <button id="opt-${i}" onclick="selectOptionGame4(${i})" class="btn-3d btn-gray py-4 px-5 rounded-2xl text-base md:text-lg font-black text-left flex items-center gap-3">
                                <span class="w-7 h-7 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs font-black text-slate-400 shrink-0">${i+1}</span>
                                <span>${opt.kanji}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            setTimeout(() => speakJP(q.questionAudioText || q.question), 300);
        }

        function selectOptionGame4(index) {
            const q = currentQuestions[currentIndex];
            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-${i}`);
                if (btn) btn.classList.remove('selected');
            });

            const selectedBtn = document.getElementById(`opt-${index}`);
            if (selectedBtn) selectedBtn.classList.add('selected');

            selectedOption = index;
            document.getElementById('btn-action').disabled = false;

            speakJP(q.options[index].text);
        }

        // --- CHECK ANSWER & FEEDBACK LOGIC ---
        function handleActionButton() {
            const btn = document.getElementById('btn-action');
            if (btn.textContent === "TIẾP THEO") {
                currentIndex++;
                if (currentIndex >= currentQuestions.length) {
                    showResults();
                } else {
                    renderQuestion();
                    updateTopBar();
                }
                return;
            }

            // Verify Answer
            const q = currentQuestions[currentIndex];
            let type = currentMode;
            if (currentMode === 'mix' || currentMode === 'review') {
                type = q._gameType || (q.context ? 1 : q.sentence ? 2 : q.vietnamese ? 3 : 4);
            }

            let isCorrect = false;

            if (type === 1) {
                isCorrect = q.shuffledOptions[selectedOption].isCorrect;
            } else if (type === 2) {
                isCorrect = (selectedOption === q.correctIndex);
            } else if (type === 3) {
                const userOrder = currentSentenceBlocks.map(b => b.text);
                isCorrect = q.acceptableOrders.some(order => 
                    order.length === userOrder.length && order.every((val, idx) => val === userOrder[idx])
                );
            } else if (type === 4) {
                isCorrect = (selectedOption === q.correctIndex);
            }

            displayFeedback(isCorrect, q, type);
        }

        function displayFeedback(isCorrect, q, type) {
            const bottomBar = document.getElementById('bottom-bar');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDiff = document.getElementById('feedback-diff');
            const expWrapper = document.getElementById('explanation-wrapper');
            const expBox = document.getElementById('feedback-explanation');
            const btnAction = document.getElementById('btn-action');

            feedbackIcon.classList.remove('hidden');

            if (isCorrect) {
                score += 10;
                streak++;
                bottomBar.className = "border-t-2 border-green-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 bg-[#D7FFB8] shrink-0";
                feedbackIcon.textContent = "🎉";
                feedbackTitle.textContent = "Chính xác! Tuyệt vời!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-[#2B6600]";
                feedbackDiff.textContent = `+10 điểm | Chuỗi: 🔥 ${streak}`;
                feedbackDiff.className = "text-sm font-bold text-green-700";

                // Highlight correct button UI
                if (type === 1 || type === 2 || type === 4) {
                    const btn = document.getElementById(`opt-${selectedOption}`);
                    if (btn) btn.classList.add('btn-option-correct');
                }
            } else {
                hearts--;
                streak = 0;
                bottomBar.className = "border-t-2 border-red-300 px-4 md:px-8 py-3.5 flex flex-col md:flex-row items-center justify-between gap-3 bg-[#FFDFE0] shrink-0";
                feedbackIcon.textContent = "😅";
                feedbackTitle.textContent = "Chưa chính xác rồi!";
                feedbackTitle.className = "text-lg md:text-xl font-black text-[#A30000]";
                feedbackDiff.textContent = `Hãy đọc kỹ giải thích nhé!`;
                feedbackDiff.className = "text-sm font-bold text-red-700";

                // Save to mistakes list
                if (!wrongQuestions.some(item => item.id === q.id)) {
                    wrongQuestions.push(q);
                    safeSet(KEY_MISTAKES, JSON.stringify(wrongQuestions));
                }

                // Highlight wrong button UI & show correct
                if (type === 1) {
                    const btn = document.getElementById(`opt-${selectedOption}`);
                    if (btn) btn.classList.add('btn-option-wrong');
                    q.shuffledOptions.forEach((opt, idx) => {
                        if (opt.isCorrect) {
                            const cBtn = document.getElementById(`opt-${idx}`);
                            if (cBtn) cBtn.classList.add('btn-option-correct');
                        }
                    });
                } else if (type === 2 || type === 4) {
                    const btn = document.getElementById(`opt-${selectedOption}`);
                    if (btn) btn.classList.add('btn-option-wrong');
                    const cBtn = document.getElementById(`opt-${q.correctIndex}`);
                    if (cBtn) cBtn.classList.add('btn-option-correct');
                }
            }

            // Fill explanation content
            if (q.explanation) {
                expWrapper.classList.remove('hidden');
                expBox.innerHTML = `
                    <div class="mb-1 text-emerald-700"><strong>✅ Đúng:</strong> ${q.explanation.correct || ''}</div>
                    ${q.explanation.pitfalls ? `<div class="mb-1 text-amber-700"><strong>⚠️ Lưu ý:</strong> ${q.explanation.pitfalls}</div>` : ''}
                    ${q.explanation.tip ? `<div class="text-blue-700"><strong>💡 Mẹo nhớ:</strong> ${q.explanation.tip}</div>` : ''}
                `;
            }

            updateTopBar();

            btnAction.textContent = "TIẾP THEO";
            btnAction.className = "btn-3d btn-green text-lg md:text-xl px-8 py-3.5 rounded-2xl uppercase tracking-wider font-extrabold shadow-md w-full md:w-auto ml-auto";
            btnAction.disabled = false;

            if (hearts <= 0) {
                setTimeout(() => {
                    document.getElementById('hearts-modal').classList.remove('hidden');
                }, 600);
            }
        }

        function toggleExplanationDetails() {
            const expBox = document.getElementById('feedback-explanation');
            const arrow = document.getElementById('exp-arrow');
            if (expBox.classList.contains('hidden')) {
                expBox.classList.remove('hidden');
                arrow.textContent = "▲";
            } else {
                expBox.classList.add('hidden');
                arrow.textContent = "▼";
            }
        }

        function practiceCurrentWrongList() {
            document.getElementById('hearts-modal').classList.add('hidden');
            startGame('review');
        }

        function retryCurrentGame() {
            document.getElementById('hearts-modal').classList.add('hidden');
            startGame(currentMode);
        }

        function showResults() {
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('bottom-bar').classList.add('hidden');

            const prevHigh = parseInt(safeGet(KEY_HIGH) || "0");
            if (score > prevHigh) {
                safeSet(KEY_HIGH, score.toString());
            }

            const total = currentQuestions.length;
            const percentage = Math.round((score / (total * 10)) * 100);

            const container = document.getElementById('game-container');
            container.innerHTML = `
                <div class="w-full max-w-lg mx-auto flex flex-col items-center text-center p-6 anim-pop">
                    <div class="text-6xl mb-4">${percentage >= 80 ? '🏆' : percentage >= 50 ? '🌟' : '💪'}</div>
                    <h2 class="text-3xl font-black text-slate-800 mb-2">Hoàn thành bài tập!</h2>
                    <p class="text-slate-500 font-bold mb-6">Bạn đã vượt qua các câu hỏi Bài ${LESSON_CONFIG.lessonNo}</p>

                    <div class="w-full bg-slate-50 border-2 border-slate-200 rounded-3xl p-6 mb-6 flex justify-around items-center">
                        <div>
                            <div class="text-xs text-slate-400 font-extrabold uppercase">Điểm số</div>
                            <div class="text-3xl font-black text-amber-500">⭐ ${score}</div>
                        </div>
                        <div class="h-10 w-0.5 bg-slate-200"></div>
                        <div>
                            <div class="text-xs text-slate-400 font-extrabold uppercase">Chính xác</div>
                            <div class="text-3xl font-black text-green-500">${percentage}%</div>
                        </div>
                    </div>

                    <div class="w-full flex flex-col gap-3">
                        <button onclick="startGame(currentMode)" class="btn-3d btn-green py-4 rounded-2xl font-black text-lg uppercase tracking-wider">
                            🔄 Luyện tập lại
                        </button>
                        <button onclick="showMainMenu()" class="btn-3d btn-gray py-4 rounded-2xl font-black text-lg text-slate-700">
                            🏠 Về Menu chính
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            showMainMenu();
        });
    </script>
</body>
</html>
