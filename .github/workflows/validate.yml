name: Validate lessons

# Chạy npm run validate cho mọi PR vào main, để làm required check trước khi auto-merge bài và slide.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài dependency
        run: npm ci
      - name: npm run validate
        run: npm run validate
